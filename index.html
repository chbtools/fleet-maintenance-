<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#26303a">
<title>Fleet Maintenance Log</title>
<!-- SETUP: paste your Google Apps Script web app URL between the quotes -->
<script>window.FLEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1ACsu2pcRyi0FdRoTLzyYFb01gpqIkqeO5qpUSdieYDf_y77kTjZqCYhdteYaQ9esIg/exec";</script>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: steel header band over a concrete-grey shop floor; work-order rows, unit tags, tabbed sections. */
:root{
  --bg:#eeede9; --surface:#fbfaf7; --sunk:#e4e2dd; --ink:#1c1e21; --muted:#5f6268; --line:#d4d1cb;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#f6e1d6;
  --steel:#26303a; --on-steel:#f2f0eb; --on-steel-muted:#a9b2bb;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a86a12; --warn-soft:#f6ead2; --bad:#b42318; --bad-soft:#f7dcd8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131415; --surface:#1c1e20; --sunk:#25272a; --ink:#ecebe6; --muted:#9b9c98; --line:#32353a;
  --accent:#f07a3e; --accent-ink:#1a0d06; --accent-soft:#3a2216;
  --steel:#0d1013; --on-steel:#f2f0eb; --on-steel-muted:#8e98a2;
  --ok:#55b77f; --ok-soft:#1b3326; --warn:#e2a740; --warn-soft:#3a2e15; --bad:#f2675d; --bad-soft:#3d1c19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131415; --surface:#1c1e20; --sunk:#25272a; --ink:#ecebe6; --muted:#9b9c98; --line:#32353a;
  --accent:#f07a3e; --accent-ink:#1a0d06; --accent-soft:#3a2216;
  --steel:#0d1013; --on-steel:#f2f0eb; --on-steel-muted:#8e98a2;
  --ok:#55b77f; --ok-soft:#1b3326; --warn:#e2a740; --warn-soft:#3a2e15; --bad:#f2675d; --bad-soft:#3d1c19;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em}

/* header */
.band{background:var(--steel);color:var(--on-steel);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.band-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand small{display:block;color:var(--on-steel-muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:32px;padding:5px 10px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.log-btn{font-family:var(--display);font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;padding:8px 16px}

/* kpis */
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{padding:12px 14px;min-width:0;background:var(--surface)}
.kpi .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .val{font-family:var(--display);font-weight:600;font-size:1.75rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .val.bad{color:var(--bad)} .kpi .val.warn{color:var(--warn)}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:last-child:nth-child(odd){grid-column:1/-1}}

/* tabs */
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;padding:8px 14px;font-family:var(--display);font-size:1.15rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 180px;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:40px}
textarea{min-height:76px;resize:vertical}
.toolbar select{width:auto}

/* fleet */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.unit:hover{border-color:var(--muted)}
.unit-top{display:flex;align-items:flex-start;gap:10px}
.tag{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.03em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 8px;white-space:nowrap}
.unit-name{flex:1;min-width:0;font-weight:500;line-height:1.3}
.unit-name small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.unit-meta{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.unit-meta b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-soft)} .pill.warn{color:var(--warn);background:var(--warn-soft)} .pill.bad{color:var(--bad);background:var(--bad-soft)} .pill.idle{color:var(--muted);background:var(--sunk)}
.pm{font-size:.82rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* work orders */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:92px 1fr auto;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:start;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .d{font-size:.84rem;color:var(--muted)}
.row .d b{display:block;color:var(--ink);font-weight:600}
.row .w{min-width:0}
.row .w .t{font-weight:500;overflow-wrap:anywhere;white-space:pre-line}
.row .w .s{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;align-items:center}
.row .c{font-weight:600;text-align:right;white-space:nowrap}
.kind{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.kind.Repair{color:var(--bad)} .kind.Service{color:var(--ok)} .kind.Inspection{color:var(--muted)}
.open-flag{color:var(--warn);font-weight:600}
@media (max-width:520px){.row{grid-template-columns:1fr auto}.row .d{grid-column:1/-1;display:flex;gap:8px}.row .d b{display:inline}}

/* empty */
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--display);font-size:1.5rem;color:var(--ink);margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em}
.empty p{margin:0 auto 14px;max-width:46ch}

/* reports */
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.rep-grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h3{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px;font-weight:600}
.big{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.split div{border-top:3px solid var(--line);padding-top:6px;font-size:.82rem;color:var(--muted)}
.split div b{display:block;color:var(--ink);font-size:1rem}
.split .r{border-color:var(--bad)} .split .s{border-color:var(--ok)} .split .i{border-color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.bar{height:6px;background:var(--accent);border-radius:3px;min-width:2px}
.chart svg{width:100%;height:auto;display:block}
.share-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.note{font-size:.84rem;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:100%;max-width:620px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:10px 10px 0 0}
.sheet-h h2{flex:1;margin:0;font-family:var(--display);font-size:1.45rem;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.x{background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.sheet-b{padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet-f .sp{flex:1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.lbl{font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f .hint{font-size:.78rem;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:480px){.g3{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;cursor:pointer;font-weight:500;border-left:1px solid var(--line);min-height:42px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.total-line{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.total-line b{font-family:var(--display);font-size:1.6rem}
.err{color:var(--bad);font-size:.86rem}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.dl dt{color:var(--muted)} .dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--steel);color:var(--on-steel);padding:10px 16px;border-radius:var(--r);z-index:60;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:.9rem}
.copybox{width:100%;min-height:160px;font-family:var(--mono);font-size:.8rem}

/* work orders */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;min-height:36px;cursor:pointer;font-weight:500;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75}
.me-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-2px 0 14px;font-size:.88rem;color:var(--muted)}
.me-row select{width:auto;min-height:36px;padding:4px 8px}
.wo-group{margin-bottom:18px}
.wo-group h3{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.wo-group h3 b{color:var(--ink);font-variant-numeric:tabular-nums}
.wos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.wo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;width:100%}
.wo:hover{border-color:var(--muted)}
.wo[data-pri="Urgent"]{box-shadow:inset 4px 0 0 var(--bad)}
.wo[data-pri="High"]{box-shadow:inset 4px 0 0 var(--warn)}
.wo-top{display:flex;gap:8px;align-items:flex-start}
.wo-top .tag{font-size:1rem}
.wo-title{flex:1;min-width:0;font-weight:500;line-height:1.3;overflow-wrap:anywhere;white-space:pre-line}
.wo-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.82rem;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}
.av{width:22px;height:22px;border-radius:50%;background:var(--steel);color:var(--on-steel);font-size:.66rem;font-weight:700;display:inline-grid;place-items:center;letter-spacing:.02em}
.who.none{color:var(--muted);font-weight:400}.who.none .av{background:var(--sunk);color:var(--muted)}
.due.over{color:var(--bad);font-weight:600}
.pri{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:3px;white-space:nowrap}
.pri.Urgent{background:var(--bad-soft);color:var(--bad)}.pri.High{background:var(--warn-soft);color:var(--warn)}.pri.Normal{background:var(--sunk);color:var(--muted)}.pri.Low{background:var(--sunk);color:var(--muted)}
.stage{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.stage.open{background:var(--accent-soft);color:var(--accent)}.stage.in_progress{background:var(--ok-soft);color:var(--ok)}.stage.waiting{background:var(--warn-soft);color:var(--warn)}.stage.done{background:var(--sunk);color:var(--muted)}.stage.approval,.stage.equipment{background:var(--warn-soft);color:var(--warn)}.stage.planning,.stage.scheduled{background:var(--sunk);color:var(--ink)}.stage.rejected{background:var(--bad-soft);color:var(--bad)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs a{display:block;width:76px;height:76px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunk);position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs a.broken img{display:none}
.thumbs a.broken::after{content:"Open photo";position:absolute;inset:0;display:grid;place-items:center;padding:6px;font-size:.72rem;text-align:center;color:var(--ink)}
.thumbx{position:relative}
.thumbx .px{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.passfail{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.passfail button{border:0;background:var(--surface);min-height:42px;padding:8px 12px;cursor:pointer;font-weight:600}
.passfail button+button{border-left:1px solid var(--line)}
.passfail button[data-r="pass"][aria-pressed="true"]{background:var(--ok);color:#fff}
.passfail button[data-r="fail"][aria-pressed="true"]{background:var(--bad);color:#fff}
.passfail button[data-r="na"][aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.check-item{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check-item .nm{flex:1;min-width:0;font-weight:500}
.level-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.task-line{display:flex;gap:8px;align-items:flex-start;padding-top:6px;border-top:1px dashed var(--line)}
.task-line .nm{flex:1;min-width:0}
.check-on{display:flex;gap:8px;align-items:center;font-weight:500}
.wo-desc{font-size:1.05rem;line-height:1.45;margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 auto;justify-content:center;text-decoration:none;color:inherit}
.actions .btn.primary{color:var(--accent-ink)}
.share-box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.share-box.notify{border-color:var(--accent);background:var(--accent-soft)}
.section-lbl{font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.seg.wrap4 button{font-size:.88rem;padding:8px 4px}
.seg.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.seg.grid button{border-left:0;line-height:1.2}
.seg.grid button:last-child:nth-child(odd){grid-column:span 2}
.seg.grid button:not([aria-pressed="true"]){background:var(--surface)}
@media (max-width:480px){.seg.grid{grid-template-columns:1fr 1fr}}
.team-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.team-row:first-child{border-top:0}
.team-row .nm{flex:1;min-width:0}
.team-row .nm small{display:block;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap}
@media (max-width:520px){.brand h1{font-size:1.2rem}.brand small{font-size:.7rem}.log-btn{font-size:1rem;padding:8px 12px}.tab{font-size:1rem;padding:8px 7px}.tabs{gap:0}}
.pwo table{table-layout:fixed}.pwo td{overflow-wrap:anywhere}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:58px 1fr 92px 34px;gap:6px;align-items:center;background:var(--sunk);border-radius:var(--r);padding:8px}
.prow input{min-height:38px;padding:6px 8px}
.prow .pdesc{grid-column:1/4}
.prow .px{grid-row:1/3;grid-column:4;align-self:stretch;border:0;background:none;color:var(--muted);font-size:1.4rem;cursor:pointer;border-radius:var(--r)}
.prow .px:hover{color:var(--bad);background:var(--bad-soft)}
.phead{display:grid;grid-template-columns:58px 1fr 92px 34px;gap:6px;padding:0 8px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#printArea{display:none}
@page{size:letter;margin:12mm 13mm}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:12pt;padding:0}
  :root{padding:0!important}
  body{background:#fff!important}
}
.pwo h1{font-size:20pt;margin:0;letter-spacing:.02em;text-transform:uppercase}

<script>
(function(){
const TYPES=["Forklift","Air compressor","Truck","Trailer","Loader / skid steer","Generator","Crane / hoist","Mower","Other"];
const KINDS=["Repair","Service","Inspection"];
const PREFS={id:"prefs",digestOn:"no",dateSoonDays:30,recipients:"[]",includeSms:"no",appUrl:""};
const S={units:[],records:[],employees:[],checks:[],levels:[],pmTasks:[],checklists:[],settings:Object.assign({},PREFS),me:"",pendingWO:null,wo:{view:"open"},tab:"fleet",canWrite:true,db:null,dl:null,loaded:{u:false,r:false},status:"loading",sample:false,
  hist:{q:"",unit:"all",kind:"all"},rep:{range:"ytd",unit:"all",from:"",to:""}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const h=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:n%1?2:0,minimumFractionDigits:n%1?2:0}).format(n||0);
const money0=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n||0);
const numv=v=>{const n=parseFloat(String(v||"").replace(/[$,]/g,""));return isFinite(n)?n:0};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const fmtDate=s=>{if(!s)return"";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
const fmtShort=s=>{if(!s)return"";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"})};
const daysBetween=(a,b)=>{const p=s=>{const[y,m,d]=String(s).split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const addDays=(iso,n)=>{const[y,m,d]=String(iso).split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d));dt.setUTCDate(dt.getUTCDate()+n);return dt.toISOString().slice(0,10)};
const startOfWeek=iso=>{const[y,m,d]=String(iso).split("-").map(Number);const day=new Date(Date.UTC(y,m-1,d)).getUTCDay();return addDays(iso,day===0?-6:1-day)};
const parseJson=(s,fallback)=>{if(Array.isArray(s)||(s&&typeof s==="object"))return s;try{const v=JSON.parse(s||"");return v==null?fallback:v}catch(_){return fallback}};
const isYes=v=>v!=="no"&&v!==false&&v!=="false"&&v!==0&&v!=="0";
const fmtHrs=n=>{const x=Math.round(numv(n)*10)/10;return x.toLocaleString(undefined,{maximumFractionDigits:1})};
const total=r=>numv(r.partsCost)+numv(r.laborCost)+numv(r.otherCost);
const wo=r=>"WO-"+String(r.id||"").replace(/[^a-z0-9]/gi,"").slice(-5).toUpperCase();
const unitById=id=>S.units.find(u=>u.id===id);
const unitLabel=id=>{const u=unitById(id);if(u)return u.unit;if(String(id||"").startsWith("?"))return String(id).slice(1)+" (not in fleet)";return"(removed)"};
const checksFor=id=>S.checks.filter(c=>c.unitId===id).sort((a,b)=>String(b.at||b.date).localeCompare(String(a.at||a.date)));
const fmtTime=s=>{const d=new Date(s);return isNaN(d)?"":d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})};
const meterUnit=u=>u&&u.meterType==="Miles"?"mi":u&&u.meterType==="Hours"?"hrs":"";
function toast(msg){$("#toastRoot").innerHTML="";const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toastRoot").appendChild(t);setTimeout(()=>t.remove(),2600)}
function sortedUnits(){return S.units.slice().sort((a,b)=>String(a.unit).localeCompare(String(b.unit),undefined,{numeric:true}))}
function recsFor(id){return S.records.filter(r=>r.unitId===id)}
function curMeter(u){let m=numv(u.meter);for(const r of recsFor(u.id))if(numv(r.meter)>m)m=numv(r.meter);return m}

/* Old single-interval PM, used until a unit has PM levels. */
function legacyPmStatus(u){
  const hrs=numv(u.pmMeter),days=numv(u.pmDays);
  if(!hrs&&!days)return null;
  const svc=recsFor(u.id).filter(r=>r.kind==="Service"&&r.status!=="open"&&r.stage!=="rejected").sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!svc)return{level:"warn",text:"No PM logged yet"};
  let level="ok",parts=[];
  if(hrs){const since=curMeter(u)-numv(svc.meter);const left=hrs-since;
    if(numv(svc.meter)||curMeter(u)){if(left<=0){level="bad";parts.push(Math.abs(Math.round(left))+" "+meterUnit(u)+" over")}
      else{if(left<=hrs*.1&&level!=="bad")level="warn";parts.push(Math.round(left)+" "+meterUnit(u)+" left")}}}
  if(days){const left=days-daysBetween(svc.date,today());
    if(left<=0){level="bad";parts.push(Math.abs(left)+" days over")}
    else{if(left<=Math.max(7,days*.1)&&level!=="bad")level="warn";parts.push(left+" days left")}}
  return{level,text:(level==="bad"?"PM overdue · ":level==="warn"?"PM due soon · ":"PM ok · ")+parts.join(", ")};
}
/* Same due / soon / overdue rules as Code.gs pmTaskInfo. */
function warnDays(every){every=numv(every);if(every<=1)return 0;if(every<=7)return 1;return Math.max(2,Math.round(every*0.1))}
function pmTaskInfo(unit,level,task){
  const off=summary=>({status:"off",summary,suggested:"",openWoId:""});
  if(!task||!isYes(task.active))return off("Paused");
  if(!level)return off("This task needs a PM level.");
  if(!isYes(level.active))return off("This level is paused.");
  const open=S.records.find(r=>r.pmTaskId===task.id&&r.status==="open");
  const day=today();
  let status="ok",reasons=[],suggested="";
  const rank={ok:0,soon:1,due:2,overdue:3};
  const worse=(a,b)=>rank[a]>=rank[b]?a:b;
  const consider=iso=>{if(iso&&(!suggested||iso<suggested))suggested=iso};
  const basis=level.basis;
  if(basis==="calendar"||basis==="both"){
    const every=numv(level.everyDays);
    if(every>0){
      if(!task.lastCompletedAt){status=worse(status,"due");reasons.push("no PM logged yet");consider(day)}
      else{
        const due=addDays(String(task.lastCompletedAt).slice(0,10),every);
        const left=daysBetween(day,due);
        consider(due);
        if(left<0){status=worse(status,"overdue");reasons.push(Math.abs(left)+" day"+(left===-1?"":"s")+" over")}
        else if(left===0){status=worse(status,"due");reasons.push("due today")}
        else if(left<=warnDays(every)){status=worse(status,"soon");reasons.push(left+" day"+(left===1?"":"s")+" left")}
        else reasons.push(left+" days left");
      }
    }
  }
  const metered=unit&&unit.meterType!=="None";
  if((basis==="meter"||basis==="both")&&metered){
    const everyM=numv(level.everyMeter),word=meterUnit(unit)||"hrs";
    if(everyM>0){
      const hasLast=!(task.lastMeter===""||task.lastMeter==null)&&isFinite(Number(task.lastMeter));
      if(!hasLast){status=worse(status,"due");reasons.push("no meter at last PM");consider(day)}
      else{
        const leftM=Number(task.lastMeter)+everyM-curMeter(unit);
        if(leftM<=0){status=worse(status,"overdue");reasons.push(Math.abs(Math.round(leftM))+" "+word+" over");consider(day)}
        else{if(leftM<=Math.max(1,everyM*0.1))status=worse(status,"soon");reasons.push(Math.round(leftM)+" "+word+" left")}
      }
    }
  }
  if(basis==="meter"&&unit&&unit.meterType==="None"){status=worse(status,"due");reasons.push("unit has no meter")}
  const label=status==="overdue"?"Overdue":status==="due"?"Due now":status==="soon"?"Due soon":"OK";
  let summary=[label].concat(reasons).join(" · ");
  if(open)summary+=" · work order already open";
  return{status,summary,suggested,openWoId:open?open.id:""};
}
function intervalLabel(level,u){
  if(!level)return"";
  const d=numv(level.everyDays),m=numv(level.everyMeter),w=meterUnit(u)||"hrs";
  if(level.basis==="both")return"every "+d+" days or "+m+" "+w+", whichever comes first";
  if(level.basis==="meter")return"every "+m+" "+w;
  return"every "+d+" day"+(d===1?"":"s");
}
function levelsFor(id){return S.levels.filter(l=>l.unitId===id)}
function tasksForUnit(id){return S.pmTasks.filter(t=>t.unitId===id)}
function pmStatus(u){
  const levels=levelsFor(u.id);
  if(!levels.length)return legacyPmStatus(u);
  const rank={off:-1,ok:0,soon:1,due:2,overdue:3};
  let worst="off";const bits=[];
  for(const t of tasksForUnit(u.id)){
    const level=S.levels.find(l=>l.id===t.levelId);
    const info=pmTaskInfo(u,level,t);
    if(rank[info.status]>rank[worst])worst=info.status;
    if(info.status==="soon"||info.status==="due"||info.status==="overdue"){
      const name=levels.length>1&&level?level.name+": ":"";
      bits.push(name+info.summary.replace(/^(Overdue|Due now|Due soon|OK) · /,""));
    }
  }
  if(worst==="off")return{level:"ok",text:"PM schedule · "+levels.length+" level"+(levels.length>1?"s":"")};
  const pill=worst==="overdue"?"bad":worst==="ok"?"ok":"warn";
  const head=worst==="overdue"?"PM overdue":worst==="due"?"PM due":worst==="soon"?"PM due soon":"PM ok";
  return{level:pill,text:bits.length?head+" · "+bits.slice(0,2).join(", "):head};
}
function duePmTasks(unitId){
  return S.pmTasks.filter(t=>{
    if(unitId&&t.unitId!==unitId)return false;
    const u=unitById(t.unitId),level=S.levels.find(l=>l.id===t.levelId);
    const info=pmTaskInfo(u,level,t);
    return(info.status==="due"||info.status==="overdue")&&!info.openWoId;
  });
}
function dateItems(u){
  const soon=numv(S.settings.dateSoonDays)||30;
  const fields=[["warrantyExpires","Warranty"],["certExpires","Certification"],["registrationExpires","Registration"]];
  const items=[];
  for(const[k,label]of fields){
    const d=String(u[k]||"").slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
    const left=daysBetween(today(),d);
    let level="ok",text="good through "+fmtShort(d);
    if(left<0){level="bad";text="overdue · "+(-left)+" day"+(left===-1?"":"s")}
    else if(left<=soon){level="warn";text=left===0?"due today":"due in "+left+" day"+(left===1?"":"s")}
    items.push({k,label,level,text,date:d});
  }
  const worst=items.some(i=>i.level==="bad")?"bad":items.some(i=>i.level==="warn")?"warn":items.length?"ok":null;
  return{level:worst,items};
}
function hoursDown(from,to){
  let h=0;
  for(const r of S.records){const d=String(r.date||"").slice(0,10);if(d&&d>=from&&d<=to)h+=numv(r.downtimeHours)}
  return Math.round(h*10)/10;
}
function photosOf(raw){const a=parseJson(raw,[]);return Array.isArray(a)?a.filter(p=>p&&(p.thumb||p.url)):[]}
function thumbsHtml(list){
  if(!list||!list.length)return"";
  return`<div class="thumbs">${list.map(p=>`<a href="${h(p.url||p.thumb)}" target="_blank" rel="noopener"><img src="${h(p.thumb||p.url)}" alt="${h(p.name||"Photo")}" onerror="this.parentNode.classList.add('broken')"></a>`).join("")}</div>`;
}
function legacyOnly(u){
  if(!u||!u.id)return true;
  const ls=levelsFor(u.id);
  return !ls.length||(ls.length===1&&isYes(ls[0].legacy));
}
function pmScheduleText(u){
  const levels=levelsFor(u.id).filter(l=>isYes(l.active));
  if(!levels.length){
    const bits=[];
    if(numv(u.pmMeter))bits.push(u.pmMeter+" "+(meterUnit(u)||"hrs"));
    if(numv(u.pmDays))bits.push(u.pmDays+" days");
    return bits.join(" or ");
  }
  return levels.map(l=>l.name+" ("+intervalLabel(l,u)+")").join("; ");
}
const statusPill=s=>{s=s||"Running";const c=s==="Running"?"ok":s==="Down"?"bad":"idle";return`<span class="pill ${c}">${h(s)}</span>`};


/* ---------- Work order helpers ---------- */
const PRIS=["Low","Normal","High","Urgent"];
const STAGES=[["open","Open"],["planning","Planning"],["scheduled","Scheduled"],["approval","Waiting on approval"],["waiting","Waiting on parts"],["equipment","Waiting on equipment"],["in_progress","In progress"]];
const STAGE_BTN={approval:"Waiting approval",waiting:"Waiting parts",equipment:"Waiting equipment"};
const stageName=k=>k==="done"?"Completed":k==="rejected"?"Rejected":((STAGES.find(x=>x[0]===k)||[,"Open"])[1]);
const stageOf=r=>r.stage==="rejected"?"rejected":r.status==="open"?(r.stage&&r.stage!=="done"&&STAGES.some(x=>x[0]===r.stage)?r.stage:"open"):"done";
const stageLabel=r=>stageName(stageOf(r));
const empById=id=>S.employees.find(e=>e.id===id);
const empByName=name=>{const n=String(name||"").trim().toLowerCase();return n?S.employees.find(e=>String(e.name||"").trim().toLowerCase()===n)||null:null};
const meName=()=>{const e=S.me&&empById(S.me);return e?e.name:""};
const empName=r=>{const e=r.assignedTo&&empById(r.assignedTo);return e?e.name:(r.assignedTo?(r.assignedName||""):"")};
const isOverdue=r=>r.status==="open"&&!!r.dueDate&&r.dueDate<today();
const priRank=p=>({Urgent:0,High:1,Normal:2,Low:3})[p||"Normal"]??2;
const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]||"").slice(0,2).join("").toUpperCase()||"?";
const woLink=r=>location.origin+location.pathname+"#wo-"+r.id;
const phoneDigits=p=>String(p||"").replace(/[^\d+]/g,"");
function partsOf(r){
  try{const a=JSON.parse(r.partsList||"[]");if(Array.isArray(a)&&a.length)return a.map(x=>({qty:x.qty||"",no:x.no||"",desc:x.desc||"",cost:x.cost||""}))}catch(_){}
  return String(r.parts||"").split(/[,;\n]+/).map(t=>t.trim()).filter(Boolean).map(t=>({qty:"",no:"",desc:t,cost:""}));
}
function partsText(list){return list.map(p=>[p.qty&&numv(p.qty)!==1?numv(p.qty)+" ×":"",p.no,p.desc].filter(Boolean).join(" ")).filter(Boolean).join(", ")}
function sortedEmps(){return S.employees.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name)))}
function whoHtml(r){const n=empName(r);return n?`<span class="who"><span class="av">${h(initials(n))}</span>${h(n)}</span>`:`<span class="who none"><span class="av">?</span>Unassigned</span>`}
function dueHtml(r){if(!r.dueDate)return"";if(r.status!=="open")return`<span class="due">Due ${fmtShort(r.dueDate)}</span>`;
  const d=daysBetween(today(),r.dueDate);
  if(d<0)return`<span class="due over">Overdue ${-d} day${d===-1?"":"s"}</span>`;
  return`<span class="due">${d===0?"Due today":d===1?"Due tomorrow":"Due "+fmtShort(r.dueDate)}</span>`}
function woMessage(r){
  const u=unitById(r.unitId),n=empName(r);
  return[`Work order ${wo(r)}${r.priority&&r.priority!=="Normal"?` (${r.priority.toUpperCase()} priority)`:""}`,
    `Unit: ${unitLabel(r.unitId)}${u&&u.name?" "+u.name:""}`,
    `${r.kind||"Repair"}: ${r.description||""}`,
    n?`Assigned to: ${n}`:"",r.dueDate?`Due: ${fmtDate(r.dueDate)}`:"",
    `Open it: ${woLink(r)}`].filter(Boolean).join("\n");
}
function decisionMessage(r){
  const base=woMessage(r);
  if(r.approvalDecision==="approved")return`Approved by ${r.approvalBy||"the shop"}${r.approvalNote?"\nNote: "+r.approvalNote:""}\n\n`+base;
  if(r.approvalDecision==="rejected")return`Rejected by ${r.approvalBy||"the shop"}${r.approvalNote?"\nNote: "+r.approvalNote:""}\n\n`+base;
  return base;
}

/* ---------- KPIs ---------- */
function renderKpis(){
  const t=today(),y=t.slice(0,4),m=t.slice(0,7);
  let ytd=0,mo=0;for(const r of S.records){if(r.date&&r.date.startsWith(y))ytd+=total(r);if(r.date&&r.date.startsWith(m))mo+=total(r)}
  const down=S.units.filter(u=>u.status==="Down").length;
  const pmDue=S.units.filter(u=>{const p=pmStatus(u);return p&&p.level!=="ok"}).length;
  const datesDue=S.units.filter(u=>{const d=dateItems(u);return d.level==="bad"||d.level==="warn"}).length;
  const open=S.records.filter(r=>r.status==="open").length,late=S.records.filter(isOverdue).length;
  const downHrs=hoursDown(startOfWeek(t),t);
  $("#kpis").innerHTML=[
    ["Units",S.units.length,""],["Down",down,down?"bad":""],["PM due / overdue",pmDue,pmDue?"warn":""],
    ["Dates due",datesDue,datesDue?"warn":""],
    ["Open work orders",late?`${open} · ${late} late`:open,late?"bad":open?"warn":""],
    ["Hours down this week",fmtHrs(downHrs),downHrs?"warn":""],
    ["Spent this month · YTD",`${money0(mo)} · ${money0(ytd)}`,""]
  ].map(([l,v,c])=>`<div class="kpi"><div class="lab">${l}</div><div class="val ${c}">${h(v)}</div></div>`).join("");
}

/* ---------- Fleet ---------- */
function renderFleet(){
  const v=$("#view");
  if(S.status==="loading"&&!S.units.length){v.innerHTML=`<div class="empty"><p>Loading fleet…</p></div>`;return}
  if(!S.units.length){
    v.innerHTML=`<div class="empty"><h3>No equipment yet</h3><p>Add each forklift, compressor, truck or machine once. Then log repairs and service against it in a few taps.</p>${S.canWrite?`<button class="btn primary" id="addFirst" type="button">+ Add first unit</button>`:""}</div>`;
    const b=$("#addFirst");if(b)b.onclick=()=>unitForm();return}
  const t=today(),y=t.slice(0,4);
  const dueN=duePmTasks().length;
  v.innerHTML=`<div class="toolbar"><div class="grow note">${S.units.length} unit${S.units.length>1?"s":""} · tap a unit for its full history</div>${S.canWrite?`<button class="btn" id="genPm" type="button">Generate due PMs${dueN?` (${dueN})`:""}</button>`:""}<button class="btn" id="xlFleet" type="button">Excel</button>${S.canWrite?`<button class="btn" id="addUnit" type="button">+ Add unit</button>`:""}</div>
  <div class="units">${sortedUnits().map(u=>{
    const rs=recsFor(u.id).sort((a,b)=>b.date.localeCompare(a.date));const last=rs[0];
    const ytd=rs.filter(r=>r.date.startsWith(y)).reduce((s,r)=>s+total(r),0);
    const pm=pmStatus(u);const m=curMeter(u);
    return`<button class="unit" type="button" data-unit="${h(u.id)}">
      <div class="unit-top"><span class="tag">${h(u.unit)}</span><div class="unit-name">${h(u.name||u.type||"")}<small>${h([u.make,u.model,u.year].filter(Boolean).join(" "))}</small></div>${statusPill(u.status)}</div>
      ${pm?`<div class="pm"><span class="pill ${pm.level}">PM</span><span>${h(pm.text.replace(/^PM [a-z ]+· /,""))}</span></div>`:""}
      ${dateItems(u).items.filter(i=>i.level!=="ok").map(i=>`<div class="pm"><span class="pill ${i.level}">${h(i.label)}</span><span>${h(i.text)}</span></div>`).join("")}

/* ---------- Reports ---------- */
function rangeDates(){
  const r=S.rep,d=new Date(),t=today(),y=d.getFullYear(),m=d.getMonth();
  switch(r.range){
    case"month":return[iso(new Date(y,m,1)),t,"This month"];
    case"lastmonth":return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0)),"Last month"];
    case"quarter":{const q=Math.floor(m/3)*3;return[iso(new Date(y,q,1)),t,"This quarter"]}
    case"ytd":return[y+"-01-01",t,"Year to date"];
    case"lastyear":return[(y-1)+"-01-01",(y-1)+"-12-31",String(y-1)];
    case"12m":return[iso(new Date(y,m-11,1)),t,"Last 12 months"];
    case"all":return["0000-01-01","9999-12-31","All time"];
    case"custom":return[r.from||"0000-01-01",r.to||"9999-12-31","Custom"];
  }
}
function reportData(){
  const[from,to,label]=rangeDates();const r=S.rep;
  const list=S.records.filter(x=>x.date>=from&&x.date<=to&&(r.unit==="all"||x.unitId===r.unit)).sort((a,b)=>a.date.localeCompare(b.date));
  const by={Repair:[0,0],Service:[0,0],Inspection:[0,0]};let parts=0,labor=0,other=0,hrs=0,down=0;
  const perUnit={};const perMonth={};
  for(const x of list){const t=total(x);(by[x.kind]||(by[x.kind]=[0,0]));by[x.kind][0]+=t;by[x.kind][1]++;
    parts+=numv(x.partsCost);labor+=numv(x.laborCost);other+=numv(x.otherCost);hrs+=numv(x.laborHours);down+=numv(x.downtimeHours);
    const pu=perUnit[x.unitId]||(perUnit[x.unitId]={t:0,n:0,r:0,s:0,d:0});pu.t+=t;pu.n++;pu.d+=numv(x.downtimeHours);if(x.kind==="Repair")pu.r+=t;else pu.s+=t;
    const mk=x.date.slice(0,7);perMonth[mk]=(perMonth[mk]||0)+t}
  const sum=parts+labor+other;
  const unitRows=Object.entries(perUnit).map(([id,v])=>({id,...v})).sort((a,b)=>b.t-a.t);
  // month axis
  let months=[];
  if(list.length){let a=(from<"1000"?list[0].date:from).slice(0,7),b=(to>"9000"?list[list.length-1].date:to).slice(0,7);
    let[yy,mm]=a.split("-").map(Number);let guard=0;while(guard++<60){const k=yy+"-"+pad(mm);months.push(k);if(k>=b)break;mm++;if(mm>12){mm=1;yy++}}
    if(months.length>24)months=months.slice(-24)}
  return{from,to,label,list,by,parts,labor,other,hrs,down,sum,unitRows,months,perMonth};
}
function chartSvg(D){
  if(D.months.length<2)return"";
  const W=640,H=210,L=52,R=8,T=12,B=28,vals=D.months.map(k=>D.perMonth[k]||0);
  const max=Math.max(...vals,1);const step=niceStep(max/4);const top=Math.ceil(max/step)*step;
  const bw=(W-L-R)/vals.length;const y=v=>T+(H-T-B)*(1-v/top);
  let g="";for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans,sans-serif">${v>=1000?"$"+(v/1000)+"k":"$"+v}</text>`}
  const every=Math.ceil(vals.length/8);
  const bars=vals.map((v,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;const[yy,mm]=D.months[i].split("-");
    const lab=i%every===0?`<text x="${x+w/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans,sans-serif">${new Date(+yy,+mm-1,1).toLocaleDateString("en-US",{month:"short"})}${mm==="01"||i===0?" ’"+yy.slice(2):""}</text>`:"";
    return`<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0,y(0)-y(v))}" fill="var(--accent)" rx="2"><title>${D.months[i]}: ${money(v)}</title></rect>${lab}`}).join("");
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly maintenance cost">${g}${bars}</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}

/* Builds a plain description of the Excel workbook (sheets, cells, formulas, formats).
   Shared by the browser writer (ExcelJS) and the offline test. */
function fleetWorkbookSpec(units, records, todayIso, helpers) {
  const { total, wo, pmText, meterUnit } = helpers;
  const MONEY = '"$"#,##0.00', MONEY0 = '"$"#,##0', DATE = 'mm/dd/yyyy', MONTH = 'mmm yyyy', INT = '#,##0';
  const colL = n => { let s = ''; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const byId = {}; units.forEach(u => byId[u.id] = u);
  const label = r => (byId[r.unitId] && byId[r.unitId].unit) || r.unitNumber || '(removed)';
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };

  /* ---- Work Log ---- */
  const recs = records.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || String(a.createdAt).localeCompare(String(b.createdAt)));
  const stLabel = helpers.stageLabel || (x => x.status === 'open' ? 'Open' : 'Completed');
  const who = helpers.empName || (x => x.assignedName || '');
  const wlHead = ['Date', 'WO #', 'Unit', 'Equipment', 'Type', 'Status', 'Problem / work', 'Parts used', 'Meter', 'Labor hrs', 'Parts $', 'Labor $', 'Other $', 'Total $', 'Vendor / tech', 'Assigned to', 'Priority', 'Due', 'Requested by', 'Work performed', 'Hours down'];
  const wl = { name: 'Work Log', cols: [12, 10, 10, 26, 11, 15, 48, 30, 10, 9, 12, 12, 12, 13, 22, 18, 10, 12, 18, 44, 12], cells: [], freeze: { row: 1, col: 0 } };
  wlHead.forEach((h, c) => wl.cells.push({ r: 0, c, v: h, head: true }));
  recs.forEach((x, i) => {
    const r = i + 1, u = byId[x.unitId];
    const row = [
      { date: x.date, fmt: DATE }, { v: wo(x) }, { v: label(x) }, { v: u ? (u.name || u.type || '') : '' },
      { v: x.kind || '' }, { v: stLabel(x), tone: x.status === 'open' ? 'warn' : null }, { v: x.description || '', wrap: true }, { v: x.parts || '', wrap: true },
      { v: num(x.meter), fmt: INT }, { v: num(x.laborHours) }, { v: num(x.partsCost) || 0, fmt: MONEY }, { v: num(x.laborCost) || 0, fmt: MONEY },
      { v: num(x.otherCost) || 0, fmt: MONEY }, { f: `SUM(K${r + 1}:M${r + 1})`, fmt: MONEY, bold: true }, { v: x.vendor || '' },
      { v: who(x) }, { v: x.priority || '' }, x.dueDate ? { date: x.dueDate, fmt: DATE } : { v: '' }, { v: x.requestedBy || '' }, { v: x.workDone || '', wrap: true },
      { v: num(x.downtimeHours) || 0, fmt: '0.0' }];
    row.forEach((cell, c) => wl.cells.push(Object.assign({ r, c }, cell)));
  });
  const last = Math.max(recs.length + 1, 2);
  wl.autoFilter = `A1:U${last}`;

  /* ---- Units ---- */
  const us = units.slice().sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const uHead = ['Unit', 'Description', 'Type', 'Make', 'Model', 'Year', 'Serial / VIN', 'Status', 'Meter', 'Meter type', 'PM every', 'PM every (days)', 'PM status (at export)', 'Notes', 'Warranty', 'Certification', 'Registration', 'PM schedule'];
  const ut = { name: 'Units', cols: [10, 28, 16, 14, 14, 7, 18, 13, 10, 10, 10, 13, 30, 36, 14, 14, 14, 36], cells: [], freeze: { row: 1, col: 1 } };
  uHead.forEach((h, c) => ut.cells.push({ r: 0, c, v: h, head: true }));
  us.forEach((u, i) => {
    const r = i + 1, pm = pmText(u);
    [{ v: u.unit, bold: true }, { v: u.name || '' }, { v: u.type || '' }, { v: u.make || '' }, { v: u.model || '' }, { v: u.year || '' }, { v: u.serial || '' },
     { v: u.status || 'Running', tone: u.status === 'Down' ? 'bad' : u.status === 'Out of service' ? 'muted' : 'ok' },
     { v: helpers.curMeter(u) || null, fmt: INT }, { v: u.meterType || '' }, { v: num(u.pmMeter), fmt: INT }, { v: num(u.pmDays) },
     { v: pm ? pm.text : '', tone: pm ? pm.level : null }, { v: u.notes || '', wrap: true },
     u.warrantyExpires ? { date: String(u.warrantyExpires).slice(0, 10), fmt: DATE } : { v: '' },
     u.certExpires ? { date: String(u.certExpires).slice(0, 10), fmt: DATE } : { v: '' },
     u.registrationExpires ? { date: String(u.registrationExpires).slice(0, 10), fmt: DATE } : { v: '' },
     { v: helpers.pmSchedule ? helpers.pmSchedule(u) : '', wrap: true }]
      .forEach((cell, c) => ut.cells.push(Object.assign({ r, c }, cell)));
  });
  ut.autoFilter = `A1:R${Math.max(us.length + 1, 2)}`;

  /* ---- Dashboard ---- */
  const R = 5000, W = n => `'Work Log'!$${n}$2:$${n}$${R}`;
  const D = W('A'), UN = W('C'), TY = W('E'), ST = W('F'), TOT = W('N'), WHO = W('P'), DUE = W('R'), DOWN = W('U');
  const db = { name: 'Dashboard', cols: [14, 30, 14, 34, 9, 14, 16, 16, 16, 14, 14], cells: [] };
  db.cells.push({ r: 0, c: 0, v: 'Fleet Maintenance Log', title: true });
  db.cells.push({ r: 1, c: 0, v: `Exported ${todayIso}. Dollar figures and counts are formulas over the Work Log and Units tabs, so they update if you add or edit rows there.`, muted: true });
  const kpis = [
    ['Units', `COUNTA(Units!$A$2:$A$${R})`, INT],
    ['Down now', `COUNTIF(Units!$H$2:$H$${R},"Down")`, INT],
    ['Open work orders', `COUNTIFS(${ST},"<>Completed",${ST},"<>Rejected",${ST},"<>")`, INT],
    ['Hours down this week', `SUMIFS(${DOWN},${D},">="&(TODAY()-WEEKDAY(TODAY(),2)+1),${D},"<="&TODAY())`, '0.0'],
    ['This month', `SUMIFS(${TOT},${D},">="&DATE(YEAR(TODAY()),MONTH(TODAY()),1))`, MONEY0],
    ['Year to date', `SUMIFS(${TOT},${D},">="&DATE(YEAR(TODAY()),1,1))`, MONEY0],
    ['All time', `SUM(${TOT})`, MONEY0]];
  const kc = [0, 2, 4, 6, 7, 8, 9, 1, 3];
  kpis.forEach(([l, f, fmt], i) => { db.cells.push({ r: 3, c: kc[i], v: l, kpiLabel: true }); db.cells.push({ r: 4, c: kc[i], f, fmt, kpi: true }); });

  // Cost by unit
  let r = 6;
  db.cells.push({ r, c: 0, v: 'Cost by unit', section: true });
  r++;
  const cuHead = ['Unit', 'Equipment', 'Status', 'PM status (at export)', 'Jobs', 'Repairs $', 'Service & insp. $', 'This year $', 'All time $', 'Last work', 'Hours down'];
  cuHead.forEach((h, c) => db.cells.push({ r, c, v: h, head: true }));
  const labels = us.map(u => ({ unit: u.unit, name: u.name || u.type || '', status: u.status || 'Running', pm: pmText(u) }));
  const known = new Set(us.map(u => u.unit));
  [...new Set(recs.map(label))].filter(l => !known.has(l)).forEach(l => labels.push({ unit: l, name: '(removed from fleet)', status: '', pm: null }));
  const first = r + 2;
  labels.forEach(L => {
    r++; const a = `$A${r + 1}`;
    [{ v: L.unit, bold: true }, { v: L.name }, { v: L.status, tone: L.status === 'Down' ? 'bad' : L.status === 'Running' ? 'ok' : 'muted' },
     { v: L.pm ? L.pm.text : '', tone: L.pm ? L.pm.level : null },
     { f: `COUNTIF(${UN},${a})`, fmt: INT },
     { f: `SUMIFS(${TOT},${UN},${a},${TY},"Repair")`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${UN},${a},${TY},"<>Repair")`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${UN},${a},${D},">="&DATE(YEAR(TODAY()),1,1))`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${UN},${a})`, fmt: MONEY, bold: true },
     { f: `IFERROR(LOOKUP(2,1/(${UN}=${a}),${D}),"")`, fmt: DATE },
     { f: `SUMIFS(${DOWN},${UN},${a})`, fmt: '0.0' }]
      .forEach((cell, c) => db.cells.push(Object.assign({ r, c }, cell)));
  });
  if (!labels.length) { r++; db.cells.push({ r, c: 0, v: 'No units yet. Add units in the app, then export again.', muted: true }); }
  else {
    const lastU = r + 1; r++;
    db.cells.push({ r, c: 0, v: 'Total', bold: true, totalRow: true });
    for (let c = 4; c <= 8; c++) { const L2 = colL(c); db.cells.push({ r, c, f: `SUM(${L2}${first}:${L2}${lastU})`, fmt: c === 4 ? INT : MONEY, bold: true, totalRow: true }); }
    db.cells.push({ r, c: 10, f: `SUM(K${first}:K${lastU})`, fmt: '0.0', bold: true, totalRow: true });
  }

  // Open work orders by person
  const people = (helpers.employees || []).map(e => e.name).filter(Boolean).sort((a, b) => a.localeCompare(b));
  recs.forEach(x => { const n = who(x); if (n && people.indexOf(n) === -1) people.push(n); });
  if (people.length || recs.some(x => x.status === 'open')) {
    r += 2;
    db.cells.push({ r, c: 0, v: 'Open work orders by person', section: true });
    r++;
    ['Person', 'Open', 'Overdue'].forEach((h, c) => db.cells.push({ r, c, v: h, head: true }));
    const openCrit = `${ST},"<>Completed",${ST},"<>Rejected",${ST},"<>"`;
    const pFirst = r + 2;
    people.forEach(n => {
      r++; const a = `$A${r + 1}`;
      db.cells.push({ r, c: 0, v: n, bold: true });
      db.cells.push({ r, c: 1, f: `COUNTIFS(${WHO},${a},${openCrit})`, fmt: INT });
      db.cells.push({ r, c: 2, f: `COUNTIFS(${WHO},${a},${openCrit},${DUE},"<"&TODAY(),${DUE},"<>")`, fmt: INT });
    });
    const pLast = r + 1; r++;
    const sumP = col => people.length ? `-SUM(${col}${pFirst}:${col}${pLast})` : '';
    db.cells.push({ r, c: 0, v: 'Unassigned', bold: true, muted: true });
    db.cells.push({ r, c: 1, f: `COUNTIFS(${openCrit})${sumP('B')}`, fmt: INT });
    db.cells.push({ r, c: 2, f: `COUNTIFS(${openCrit},${DUE},"<"&TODAY(),${DUE},"<>")${sumP('C')}`, fmt: INT });
  }

  // Cost by month (last 12 months)
  r += 2;
  db.cells.push({ r, c: 0, v: 'Cost by month (last 12 months)', section: true });
  r++;
  ['Month', 'Repairs $', 'Service & insp. $', 'Total $', 'Jobs'].forEach((h, c) => db.cells.push({ r, c, v: h, head: true }));
  const [ty, tm] = todayIso.split('-').map(Number);
  const mFirst = r + 2;
  for (let k = 11; k >= 0; k--) {
    r++; let y = ty, m = tm - k; while (m < 1) { m += 12; y--; }
    const iso = `${y}-${String(m).padStart(2, '0')}-01`, a = `$A${r + 1}`;
    const rng = `${D},">="&${a},${D},"<"&EDATE(${a},1)`;
    [{ date: iso, fmt: MONTH, bold: true },
     { f: `SUMIFS(${TOT},${rng},${TY},"Repair")`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${rng},${TY},"<>Repair")`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${rng})`, fmt: MONEY, bold: true },
     { f: `COUNTIFS(${rng})`, fmt: INT }]
      .forEach((cell, c) => db.cells.push(Object.assign({ r, c }, cell)));
  }
  const mLast = r + 1; r++;
  db.cells.push({ r, c: 0, v: '12-month total', bold: true, totalRow: true });
  for (let c = 1; c <= 4; c++) { const L2 = colL(c); db.cells.push({ r, c, f: `SUM(${L2}${mFirst}:${L2}${mLast})`, fmt: c === 4 ? INT : MONEY, bold: true, totalRow: true }); }
  r += 2;
  db.cells.push({ r, c: 0, v: 'Tip: on the Work Log tab, use the filter arrows (Status, Assigned to, a single Unit, or a Type) to see just those jobs.', muted: true });

  return [db, wl, ut];
}

/* ---------- Excel export ---------- */
let excelLib=null;
function loadExcel(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(excelLib)return excelLib;
  excelLib=new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    sc.onload=()=>ok(window.ExcelJS);sc.onerror=()=>{excelLib=null;no(new Error("load"))};document.head.appendChild(sc)});
  return excelLib;
}
async function exportExcel(btn){
  if(!S.units.length&&!S.records.length){toast("Nothing to export yet. Add a unit and log some work first.");return}
  const old=btn?btn.textContent:"";if(btn){btn.disabled=true;btn.textContent="Building Excel…"}
  try{
    const ExcelJS=await loadExcel();
    const sheets=fleetWorkbookSpec(S.units,S.records,today(),{total,wo,meterUnit,curMeter,pmText:pmStatus,pmSchedule:pmScheduleText,stageLabel,empName,employees:S.employees});
    const wb=new ExcelJS.Workbook();wb.creator="Fleet Maintenance Log";wb.created=new Date();
    const F="Arial",STEEL="FF26303A",ORANGE="FFC2410C",TONE={ok:"FF2C7A4B",bad:"FFB42318",warn:"FFA86A12",muted:"FF6B6E73"};
    for(const sp of sheets){
      const ws=wb.addWorksheet(sp.name,{views:sp.freeze?[{state:"frozen",ySplit:sp.freeze.row,xSplit:sp.freeze.col}]:[{showGridLines:sp.name!=="Dashboard"}]});
      sp.cols.forEach((w,i)=>ws.getColumn(i+1).width=w);
      for(const c of sp.cells){
        const cell=ws.getCell(c.r+1,c.c+1);
        if(c.f!=null)cell.value={formula:c.f};
        else if(c.date){const[y,m,d]=c.date.split("-").map(Number);cell.value=new Date(Date.UTC(y,m-1,d))}
        else if(c.v!=null&&c.v!=="")cell.value=c.v;
        if(c.fmt)cell.numFmt=c.fmt;
        const font={name:F,size:10};
        if(c.bold)font.bold=true;
        if(c.tone&&TONE[c.tone]){font.color={argb:TONE[c.tone]};font.bold=true}
        if(c.muted){font.color={argb:TONE.muted};font.italic=true}
        if(c.title){font.size=18;font.bold=true;font.color={argb:STEEL}}
        if(c.section){font.size=12;font.bold=true;font.color={argb:STEEL};cell.border={bottom:{style:"medium",color:{argb:ORANGE}}}}
        if(c.kpiLabel){font.size=9;font.bold=true;font.color={argb:TONE.muted}}
        if(c.kpi){font.size=16;font.bold=true;font.color={argb:STEEL}}
        if(c.head){font.bold=true;font.color={argb:"FFFFFFFF"};cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:STEEL}};cell.alignment={vertical:"middle",wrapText:true}}
        if(c.totalRow)cell.border={top:{style:"thin",color:{argb:STEEL}}};
        if(c.wrap)cell.alignment={wrapText:true,vertical:"top"};
        cell.font=font;
      }
      if(sp.autoFilter)ws.autoFilter=sp.autoFilter;
      if(sp.name!=="Dashboard")ws.getRow(1).height=20;
    }
    const buf=await wb.xlsx.writeBuffer();
    await S.dl.save({filename:`Fleet-Maintenance-${today()}.xlsx`,data:new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})});
  }catch(e){toast(e&&e.message==="load"?"Couldn't load the Excel builder. Check your connection and try again.":"Couldn't build the Excel file.")}
  finally{if(btn){btn.disabled=false;btn.textContent=old}}
}


/* ---------- Work orders ---------- */
function renderOrders(){
  const v=$("#view"),f=S.wo,me=S.me&&empById(S.me)?S.me:"";
  if(S.status==="loading"&&!S.records.length){v.innerHTML=`<div class="empty"><p>Loading work orders…</p></div>`;return}
  if(f.view==="mine"&&!me)f.view="open";
  const openAll=S.records.filter(r=>r.status==="open");
  const cutoff=iso(new Date(Date.now()-30*864e5));
  const views=[["open","All open",openAll.length]].concat(me?[["mine","My jobs",openAll.filter(r=>r.assignedTo===me).length]]:[],
    [["unassigned","Unassigned",openAll.filter(r=>!r.assignedTo).length],["done","Done · 30 days",null]]);
  let list;
  if(f.view==="done")list=S.records.filter(r=>r.status!=="open"&&(r.date||"")>=cutoff).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  else list=openAll.filter(r=>f.view==="mine"?r.assignedTo===me:f.view==="unassigned"?!r.assignedTo:true)
    .sort((a,b)=>(isOverdue(b)-isOverdue(a))||(priRank(a.priority)-priRank(b.priority))||((a.dueDate||"9999").localeCompare(b.dueDate||"9999"))||((a.date||"").localeCompare(b.date||"")));
  const emps=sortedEmps();
  const meRow=`<div class="me-row"><span>This phone belongs to</span>${emps.length?`<select id="meSel" aria-label="Who uses this phone"><option value="">Choose your name…</option>${emps.map(e=>`<option value="${h(e.id)}" ${me===e.id?"selected":""}>${h(e.name)}</option>`).join("")}</select>`:`<span>— add your team first</span>`}<span class="sp" style="flex:1"></span>${S.canWrite?`<button class="btn small" id="remBtn" type="button">Reminders</button><button class="btn small" id="teamBtn" type="button">Team${emps.length?` (${emps.length})`:""}</button>`:""}</div>`;
  const chips=`<div class="toolbar"><div class="chips" role="group" aria-label="Show">${views.map(([k,l,n])=>`<button class="chip" type="button" data-view="${k}" aria-pressed="${f.view===k}">${l}${n!=null?` <span class="n">${n}</span>`:""}</button>`).join("")}</div></div>`;
  const card=r=>{const u=unitById(r.unitId);return`<button class="wo" type="button" data-wo="${h(r.id)}" data-pri="${h(r.priority||"Normal")}">
    <div class="wo-top"><span class="tag">${h(unitLabel(r.unitId))}</span><span class="wo-title">${h(r.description||"(no description)")}</span>${r.priority==="Urgent"||r.priority==="High"?`<span class="pri ${h(r.priority)}">${h(r.priority)}</span>`:""}</div>
    <div class="wo-meta">${whoHtml(r)}${dueHtml(r)}<span class="kind ${h(r.kind)}">${h(r.kind)}</span><span class="mono">${wo(r)}</span>${numv(r.downtimeHours)?`<span class="num">${fmtHrs(r.downtimeHours)} hrs down</span>`:""}</div></button>`};
  let body;
  if(f.view==="done")body=list.length?rowsHtml(list):`<div class="empty"><p>No work orders completed in the last 30 days.</p></div>`;
  else if(!list.length){
    const msg=f.view==="mine"?"Nothing is assigned to you right now.":f.view==="unassigned"?"Every open work order has someone on it.":"No open work orders.";
    body=`<div class="empty"><h3>${msg}</h3><p>${f.view==="open"?"Tap + Work order to write one up, assign it to someone and send it to their phone.":""}</p>${S.canWrite&&f.view==="open"?`<button class="btn primary" id="woFirst" type="button">+ Work order</button>`:""}</div>`;
  }else body=STAGES.map(([k,l])=>{const g=list.filter(r=>stageOf(r)===k);return g.length?`<section class="wo-group"><h3>${l} <b>${g.length}</b></h3><div class="wos">${g.map(card).join("")}</div></section>`:""}).join("");
  v.innerHTML=meRow+chips+body;
  v.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{f.view=b.dataset.view;renderOrders()});
  v.querySelectorAll("[data-wo]").forEach(b=>b.onclick=()=>woDetail(b.dataset.wo));
  bindRows(v);
  const ms=$("#meSel");if(ms)ms.onchange=()=>{S.me=ms.value;try{localStorage.setItem("fml-me",S.me)}catch(_){}if(S.me){f.view="mine";toast("This phone is set to "+empById(S.me).name)}renderOrders()};
  const tb=$("#teamBtn");if(tb)tb.onclick=()=>teamSheet();
  const rb=$("#remBtn");if(rb)rb.onclick=()=>reminderSheet();
  const wf=$("#woFirst");if(wf)wf.onclick=()=>workForm();
}

    ["Opened",fmtDate(r.date)],["Due",r.dueDate?fmtDate(r.dueDate):""],["Meter",r.meter?numv(r.meter).toLocaleString()+" "+meterUnit(u):""],

    ["Approval",approvalLine],
    ["Work performed",r.workDone],["Parts used",partsOf(r).map(p=>[p.qty?p.qty+" ×":"",p.no,p.desc,p.cost?"— "+money(numv(p.cost)):""].filter(Boolean).join(" ")).join("\n")],["Labor",r.laborHours?`${r.laborHours} hrs${numv(r.laborRate)?" × "+money(numv(r.laborRate))+"/hr":""}${numv(r.laborCost)?" = "+money(numv(r.laborCost)):""}`:""],["Vendor / tech",r.vendor],

        ${(()=>{const list=[];const add=p=>{if(p&&!list.some(x=>x.id===p.id))list.push(p)};if(opt.notify&&notifyPerson)add(notifyPerson);else{add(emp);add(ask)}
          return list.map((p,i)=>{const phone=phoneDigits(p.phone),mail=p.email,first=p.name.split(" ")[0],primary=opt.notify&&i===0;
            return `${phone?`<a class="btn ${primary?"primary":""}" href="sms:${h(phone)}?body=${encodeURIComponent(msg)}">Text ${h(first)}</a>`:""}${mail?`<a class="btn ${primary&&!phone?"primary":""}" href="mailto:${h(mail)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(msg)}">Email ${h(first)}</a>`:""}`}).join("")})()}
        ${navigator.share?`<button class="btn" id="dShare" type="button">Share…</button>`:""}
        <button class="btn" id="dCopy" type="button">Copy link</button>
        <button class="btn" id="dPrint" type="button">Print</button>
      </div>
      ${emp&&!ph&&!em?`<span class="note">Add a phone number for ${h(emp.name)} under Team to text work orders straight to them.</span>`:""}
    </div>`,
    `${cw?`<button class="btn small" id="dEdit" type="button">Edit</button>`:""}<span class="sp"></span><button class="btn" data-close type="button">Close</button>`,
    sc=>{
      const upd=async(data,label)=>{try{await S.db.collection("records").doc(r.id).update(Object.assign({updatedAt:new Date().toISOString()},data));toast(label);if($("#scrim"))woDetail(r.id)}catch(e){toast(errMsg(e))}};
      sc.querySelectorAll("#dStage button").forEach(b=>b.onclick=()=>{if(b.getAttribute("aria-pressed")==="true")return;
        sc.querySelectorAll("#dStage button").forEach(x=>x.setAttribute("aria-pressed",x===b));
        const k=b.dataset.s,extra=k==="in_progress"&&!r.assignedTo&&me?{assignedTo:me,assignedName:empById(me).name}:{};
        upd(Object.assign({stage:k},extra),`${wo(r)} marked ${stageName(k).toLowerCase()}`)});
      const decide=async(decision)=>{
        const note=($("#dNote")&&$("#dNote").value||"").trim();
        const by=meName()||"This phone",at=new Date().toISOString();
        const next=r.dueDate&&r.dueDate>=today()?"scheduled":"open";
        const data=decision==="approved"
          ?{stage:next,approvalDecision:"approved",approvalBy:by,approvalAt:at,approvalNote:note}
          :{status:"done",stage:"rejected",date:today(),approvalDecision:"rejected",approvalBy:by,approvalAt:at,approvalNote:note,completedAt:at};
        try{
          await S.db.collection("records").doc(r.id).update(Object.assign({updatedAt:at},data));
          const label=decision==="approved"?`${wo(r)} approved — now ${stageName(next).toLowerCase()}`:`${wo(r)} rejected and closed`;
          toast(label);
          const who=empByName(r.requestedBy);
          if(who&&(who.phone||who.email))woDetail(r.id,{notify:true,who:"requester"});
          else if($("#scrim"))woDetail(r.id);
        }catch(e){toast(errMsg(e))}
      };
      const ap=$("#dApprove");if(ap)ap.onclick=()=>decide("approved");
      const rj=$("#dReject");if(rj)rj.onclick=()=>decide("rejected");
      const dm=$("#dMine");if(dm)dm.onclick=()=>upd({assignedTo:me,assignedName:empById(me).name},`${wo(r)} assigned to you`);
      const dd=$("#dDone");if(dd)dd.onclick=()=>workForm({recId:r.id,complete:true});
      const de=$("#dEdit");if(de)de.onclick=()=>workForm({recId:r.id});
      const ds=$("#dShare");if(ds)ds.onclick=async()=>{try{await navigator.share({title:subj,text:msg})}catch(_){}};
      $("#dCopy").onclick=async()=>{const link=woLink(r);try{await navigator.clipboard.writeText(link);toast("Link copied")}catch(_){openSheet("Copy link",`<textarea class="copybox" id="cb" readonly style="min-height:80px">${h(link)}</textarea>`,`<span class="sp"></span><button class="btn" data-close type="button">Done</button>`,()=>{const c=$("#cb");c.focus();c.select()})}};
      $("#dPrint").onclick=()=>printWO(r);
    });
}

function printWO(r){
  const u=unitById(r.unitId)||{};const e=h;
  const partRows=partsOf(r).slice(0,12);
  const m2=v=>"$"+numv(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});const cell$=v=>numv(v)?m2(v):"";
  const blankRows=n=>Array.from({length:n},()=>`<tr><td>&nbsp;</td><td></td><td></td><td></td></tr>`).join("");
  $("#printArea").innerHTML=`<div class="pwo">
    <div class="hd"><div><h1>Work Order</h1><div>Fleet Maintenance Log</div></div><div class="won">${e(wo(r))}</div></div>
    <table>
      <tr><th>Unit</th><td><b>${e(unitLabel(r.unitId))}</b> ${e(u.name||u.type||"")}</td><th>Opened</th><td>${e(fmtDate(r.date))}</td></tr>
      <tr><th>Make / model</th><td>${e([u.make,u.model,u.year].filter(Boolean).join(" "))}</td><th>Serial</th><td>${e(u.serial||"")}</td></tr>
      <tr><th>Type</th><td>${e(r.kind||"")}</td><th>Priority</th><td>${e(r.priority||"Normal")}</td></tr>
      <tr><th>Assigned to</th><td>${e(empName(r)||"")}</td><th>Due</th><td>${e(r.dueDate?fmtDate(r.dueDate):"")}</td></tr>
      <tr><th>Requested by</th><td>${e(r.requestedBy||"")}</td><th>Status</th><td>${e(stageLabel(r))}</td></tr>
    </table>
    <h2>Problem / work requested</h2><div class="box">${e(r.description||"")}</div>
    <h2>Work performed</h2>${r.workDone?`<div class="box">${e(r.workDone)}</div>`:`<div class="lines">${"<div></div>".repeat(4)}</div>`}
    <h2>Parts used</h2><table><tr><th style="width:10%">Qty</th><th style="width:22%">Part #</th><th>Description</th><th style="width:16%">Cost</th></tr>${partRows.map(p=>`<tr><td>${e(p.qty)}</td><td>${e(p.no)}</td><td>${e(p.desc)}</td><td>${String(p.cost).trim()?"$"+numv(p.cost).toFixed(2):""}</td></tr>`).join("")}${blankRows(partRows.length?Math.max(0,3-partRows.length):4)}${numv(r.partsCost)?`<tr><td colspan="3" style="text-align:right;font-weight:bold">Parts total</td><td><b>${m2(r.partsCost)}</b></td></tr>`:""}</table>
    <div class="keep"><h2>Labor &amp; cost</h2><table class="cost">
      <tr><th>Labor hours</th><td>${e(r.laborHours||"")}</td><th>Labor rate</th><td>${numv(r.laborRate)?m2(r.laborRate)+" / hr":""}</td></tr>
      <tr><th>Meter at finish</th><td>${e(r.meter||"")} ${e(meterUnit(u))}</td><th>Hours down</th><td>${numv(r.downtimeHours)?fmtHrs(r.downtimeHours):""}</td></tr>
      <tr><th>Vendor / tech</th><td>${e(r.vendor||"")}</td><th>Approval</th><td>${e(r.approvalDecision?`${r.approvalDecision} by ${r.approvalBy||""}${r.approvalNote?" — "+r.approvalNote:""}`:"")}</td></tr>
      <tr><th>Parts</th><td>${cell$(r.partsCost)}</td><th>Labor</th><td>${cell$(r.laborCost)}</td></tr>
      <tr><th>Other</th><td>${cell$(r.otherCost)}</td><th class="tot">Total</th><td class="tot">${total(r)?m2(total(r)):""}</td></tr></table>
    <div class="sig"><div>Technician signature &nbsp;/&nbsp; date</div><div>Supervisor sign-off &nbsp;/&nbsp; date</div></div></div>
    <div class="ft">Printed ${e(fmtDate(today()))} · ${e(woLink(r))}</div></div>`;
  setTimeout(()=>window.print(),50);
}

function teamSheet(editId){

    <div class="g2"><div class="f"><label for="ePhone">Cell phone</label><input type="tel" id="ePhone" value="${h(ed?ed.phone||"":"")}" placeholder="910-555-0123" autocomplete="off"></div>
      <div class="f"><label for="eEmail">Email</label><input type="email" id="eEmail" value="${h(ed?ed.email||"":"")}" placeholder="optional" autocomplete="off"></div></div>
    <div class="f"><label for="eCar">Text messages via</label><select id="eCar">${carrierOptions(ed&&ed.smsCarrier)}</select><span class="hint">Used only if daily reminders are set to text this person. US carriers, 10-digit numbers.</span></div>
    <div class="f" id="eCarOtherWrap" hidden><label for="eCarOther">Carrier email gateway</label><input type="text" id="eCarOther" placeholder="sms.example.com" value="${h(ed&&ed.smsCarrier&&!CARRIERS.some(c=>c[0]===ed.smsCarrier)?ed.smsCarrier:"")}"></div>
    <div class="err" id="eErr" role="alert"></div>`,

    sc=>{
      sc.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>teamSheet(b.dataset.edit));
      const nw=$("#eNew");if(nw)nw.onclick=()=>teamSheet();
      const del=$("#eDel");if(del){let armed=false;del.onclick=async()=>{if(!armed){armed=true;del.textContent="Tap again to remove";return}
        del.disabled=true;try{await S.db.collection("employees").doc(ed.id).delete();if(S.me===ed.id){S.me="";try{localStorage.removeItem("fml-me")}catch(_){}}toast(`${ed.name} removed. Their past work orders keep their name.`);teamSheet()}catch(e){$("#eErr").textContent=errMsg(e);del.disabled=false}}}
      $("#eSave").onclick=async()=>{
        const name=$("#eName").value.trim();if(!name){$("#eErr").textContent="Enter the person's name.";$("#eName").focus();return}
        if(S.employees.some(x=>x.name.toLowerCase()===name.toLowerCase()&&(!ed||x.id!==ed.id))){$("#eErr").textContent=`${name} is already on the team.`;return}
        const picked=$("#eCar").value;
        const smsCarrier=picked==="other"?$("#eCarOther").value.trim().replace(/^@/,""):picked;
        const data={name,role:$("#eRole").value.trim(),phone:$("#ePhone").value.trim(),email:$("#eEmail").value.trim(),smsCarrier,createdAt:ed?ed.createdAt:new Date().toISOString()};
        const btn=$("#eSave");btn.disabled=true;btn.textContent="Saving…";
        try{const col=S.db.collection("employees");await (ed?col.doc(ed.id):col.doc()).set(data);toast(ed?"Saved":`${name} added`);teamSheet()}
        catch(e){$("#eErr").textContent=errMsg(e);btn.disabled=false;btn.textContent=ed?"Save":"Add person"}
      };
      const car=$("#eCar"),other=$("#eCarOtherWrap");

      if(!ed)setTimeout(()=>{const n=$("#eName");if(n&&!emps.length)n.focus()},50);
    });
}

/* ---------- Sheet ---------- */
function openSheet(title,body,foot,mount){
  $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${h(title)}"><div class="sheet-h"><h2>${title}</h2><button class="x" data-close type="button" aria-label="Close">×</button></div><div class="sheet-b">${body}</div>${foot?`<div class="sheet-f">${foot}</div>`:""}</div></div>`;
  const sc=$("#scrim");sc.addEventListener("mousedown",e=>{if(e.target===sc)closeSheet()});
  sc.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  document.body.style.overflow="hidden";
  if(mount)mount(sc);
}
function closeSheet(){$("#sheetRoot").innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#scrim"))closeSheet()});

    assignedTo:S.tab==="orders"&&S.wo.view==="mine"&&S.me?S.me:""};
  let kind=r.kind||"Repair",pri=r.priority||"Normal",st=complete?"done":stageOf(r);

      <div class="f"><label for="wReq">Requested by</label><input type="text" id="wReq" value="${h(r.requestedBy||"")}" placeholder="Who reported it" ${dis}></div></div>

    <div class="g3"><div class="f"><label for="wPC">Parts $ <span class="hint" id="pcHint" style="text-transform:none;letter-spacing:0"></span></label><input type="number" id="wPC" inputmode="decimal" min="0" step="0.01" value="${h(r.partsCost||"")}" placeholder="0" ${dis}></div>

      const photos=photosOf(r.photos).slice();
      const drawPhotos=()=>{const box=$("#wPhotos");box.innerHTML=photos.map((p,i)=>`<span class="thumbx"><a href="${h(p.url||p.thumb)}" target="_blank" rel="noopener"><img src="${h(p.thumb||p.url)}" alt="${h(p.name||"Photo")}" onerror="this.parentNode.classList.add('broken')"></a>${ro?"":`<button class="px" type="button" data-pi="${i}" aria-label="Remove photo">×</button>`}</span>`).join("");

      drawPhotos();
      const take=async files=>{const err=$("#wErr");for(const file of files){if(photos.length>=8){if(err)err.textContent="8 photos is the limit on one work order.";break}try{photos.push(await fileToPhoto(file));drawPhotos()}catch(e){if(err)err.textContent=errMsg(e)}}};

      if(lib){lib.onclick=()=>$("#wLibIn").click();$("#wLibIn").onchange=e=>{take(e.target.files||[]);e.target.value=""}}
      const fillPm=()=>{const sel=$("#wPm");if(!sel)return;const uid=$("#wUnit").value;const tasks=tasksForUnit(uid).filter(t=>isYes(t.active));

        sel.innerHTML=`<option value="">Not a scheduled PM</option>`+tasks.map(t=>{const lv=S.levels.find(l=>l.id===t.levelId);return`<option value="${h(t.id)}" ${t.id===(sel.value||r.pmTaskId)?"selected":""}>${h((lv?lv.name+": ":"")+t.name)}</option>`}).join("");

      let plist=partsOf(r);
      const pSum=()=>{const has=plist.some(p=>String(p.cost).trim()!=="");const pc=$("#wPC");
        if(has){pc.value=plist.reduce((a,p)=>a+numv(p.cost),0).toFixed(2);pc.readOnly=true;$("#pcHint").textContent="· from parts list"}
        else{pc.readOnly=false;$("#pcHint").textContent=""}upd()};

        L.innerHTML=plist.map((p,i)=>`<div class="prow" data-i="${i}">

function errMsg(e){const c=e&&e.code;const m=String(e&&e.message||"");
  if(c==="unauthorized")return"The shop code was rejected. Enter the correct code and save again.";
  if(/unknown collection|unknown action|bad batch/.test(m))return"The shop sheet is still running the old Apps Script. Paste in the new Code.gs, run setup, and redeploy that same web app URL.";
  if(m==="image"||m==="compress")return"Couldn't read that photo. Try another one.";
  if(c==="server")return"The log couldn't save that: "+(m||"unknown error");
  return"Couldn't save right now. Check your connection and try again.";}

function checklistId(type){const s=("cl"+String(type||"Other").replace(/[^A-Za-z0-9]/g,"")).slice(0,40);return s.length>=4?s:"clother"}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.naturalWidth||img.width,hgt=img.naturalHeight||img.height;
      URL.revokeObjectURL(url);
      if(!w||!hgt){reject(new Error("image"));return}
      const scale=Math.min(1,1600/Math.max(w,hgt));
      w=Math.max(1,Math.round(w*scale));hgt=Math.max(1,Math.round(hgt*scale));
      const canvas=document.createElement("canvas");canvas.width=w;canvas.height=hgt;
      canvas.getContext("2d").drawImage(img,0,0,w,hgt);
      const finish=q=>canvas.toBlob(blob=>{
        if(!blob){reject(new Error("compress"));return}
        if(blob.size>700000&&q>0.5){finish(Math.round((q-0.12)*100)/100);return}
        const reader=new FileReader();
        reader.onload=()=>resolve(String(reader.result));
        reader.onerror=()=>reject(new Error("compress"));
        reader.readAsDataURL(blob);
      },"image/jpeg",q);
      finish(0.72);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("image"))};
    img.src=url;
  });
}
async function fileToPhoto(file){
  const dataUrl=await compressImage(file);
  const name=(file.name||"photo").replace(/\.\w+$/i,"")+".jpg";
  if(S.sample)return{id:genId(),name,url:dataUrl,thumb:dataUrl,fileId:"local",shared:true};
  const j=await call("upload",{name,data:dataUrl,mime:"image/jpeg"});
  if(j.shared===false)toast("Photo saved. Thumbnails show after the Google account allows anyone-with-the-link on that file.");
  return{id:genId(),name:j.name||name,url:j.url,thumb:j.thumb||j.url,fileId:j.fileId||"",shared:j.shared!==false};
}
function planLegacyClient(units,records,levels){
  const have={};(levels||[]).forEach(l=>{if(l&&l.unitId)have[l.unitId]=true});
  const out=[];
  (units||[]).forEach(u=>{
    if(!u||!u.id||have[u.id])return;
    const hrs=numv(u.pmMeter),days=numv(u.pmDays);
    if(!(hrs>0)&&!(days>0))return;
    const basis=hrs>0&&days>0?"both":hrs>0?"meter":"calendar";
    const word=u.meterType==="Miles"?"mi":"hrs";
    const name=basis==="both"?"Service":basis==="meter"?(String(Math.round(hrs*100)/100)+" "+word):("Every "+String(Math.round(days*100)/100)+" days");
    const svc=(records||[]).filter(r=>r.unitId===u.id&&r.kind==="Service"&&r.status!=="open"&&r.stage!=="rejected").sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(b.createdAt||"").localeCompare(String(a.createdAt||"")))[0];
    const levelId=("lv"+String(u.id).replace(/[^A-Za-z0-9]/g,"")).slice(0,40);
    const taskId=("tk"+String(u.id).replace(/[^A-Za-z0-9]/g,"")).slice(0,40);
    out.push({level:{id:levelId.length>=4?levelId:"lvlegacy",unitId:u.id,name,basis,everyMeter:hrs>0?hrs:0,everyDays:days>0?days:0,active:"yes",legacy:"yes",notes:"Migrated from the single PM interval on this unit.",createdAt:""},task:{id:taskId.length>=4?taskId:"tklegacy",unitId:u.id,levelId:levelId.length>=4?levelId:"lvlegacy",name:"Scheduled service",instructions:"",partsJson:"[]",active:"yes",lastCompletedAt:svc&&svc.date?String(svc.date).slice(0,10):"",lastMeter:svc&&numv(svc.meter)>0?numv(svc.meter):"",lastWoId:svc?svc.id:"",createdAt:""}});
  });
  return out;
}

  let res;

  catch(_){throw{code:"unavailable"}}

  if(!j.ok){if(j.error==="unauthorized"){askCode(true);throw{code:"unauthorized"}}throw{code:"server",message:j.error}}

function startSample(){
  S.sample=true;S.canWrite=true;S.dl=downloader;
  let bag;try{bag=JSON.parse(localStorage.getItem(SAMPLE_KEY)||"")}catch(_){bag=null}
  if(!bag||!Array.isArray(bag.units)||!bag.units.length)bag=seedSample();
  ["units","records","employees","checks","levels","pmTasks","checklists","settings"].forEach(k=>{if(!Array.isArray(bag[k]))bag[k]=[]});
  const sync=()=>{
    takeList(bag);
    const plan=planLegacyClient(S.units,S.records,S.levels);
    if(plan.length){
      const now=new Date().toISOString();
      plan.forEach(p=>{p.level.createdAt=now;p.task.createdAt=now;bag.levels.push(p.level);bag.pmTasks.push(p.task)});
      try{localStorage.setItem(SAMPLE_KEY,JSON.stringify(bag))}catch(_){}
      takeList(bag);
    }
    S.sample=true;S.status="ready";
  };
  const write=(op)=>{
    const list=bag[op.collection];if(!list)throw{code:"server",message:"unknown collection"};
    if(op.op==="delete"){const i=list.findIndex(x=>x.id===op.id);if(i>=0)list.splice(i,1);return}
    const data=Object.assign({},op.data||{});
    if(op.collection==="records")data.total=numv(data.partsCost)+numv(data.laborCost)+numv(data.otherCost);
    const i=list.findIndex(x=>x.id===op.id);
    if(op.op==="update"){if(i<0)throw{code:"server",message:"not found"};list[i]=Object.assign({},list[i],data,{id:op.id})}
    else if(i<0)list.push(Object.assign({},data,{id:op.id}));else list[i]=Object.assign({},data,{id:op.id});
  };
  const commit=async ops=>{ops.forEach(write);try{localStorage.setItem(SAMPLE_KEY,JSON.stringify(bag))}catch(_){}sync();$("#banner").innerHTML=sampleBanner();render();const b=$("#sampleReset");if(b)b.onclick=reset};
  S.db={collection(name){return{doc(id){id=id||genId();return{id,
    set:async d=>{await commit([{op:"set",collection:name,id,data:d}])},
    update:async d=>{await commit([{op:"update",collection:name,id,data:d}])},
    delete:async()=>{await commit([{op:"delete",collection:name,id}])}}}}},
    batch:async ops=>{await commit(ops||[])}};
  function sampleBanner(){return `<div class="banner">Sample fleet on this phone only. Nothing here is written to the shop sheet. <button type="button" class="btn small" id="sampleReset">Reset sample</button></div>`}
  function reset(){try{localStorage.removeItem(SAMPLE_KEY)}catch(_){}bag=seedSample();sync();$("#banner").innerHTML=sampleBanner();render();const b=$("#sampleReset");if(b)b.onclick=reset;toast("Sample fleet reset")}

}
