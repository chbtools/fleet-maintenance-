/* Builds a plain description of the Excel workbook (sheets, cells, formulas, formats).
   Shared by the browser writer (ExcelJS) and the offline test. */
function fleetWorkbookSpec(units, records, todayIso, helpers) {
  const { total, wo, pmText, meterUnit } = helpers;
  const MONEY = '"$"#,##0.00', MONEY0 = '"$"#,##0', DATE = 'mm/dd/yyyy', MONTH = 'mmm yyyy', INT = '#,##0';
  const colL = n => { let s = ''; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const byId = {}; units.forEach(u => byId[u.id] = u);
  const label = r => (byId[r.unitId] && byId[r.unitId].unit) || r.unitNumber || '(removed)';
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };

  /* ---- Work Log ---- */
  const recs = records.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || String(a.createdAt).localeCompare(String(b.createdAt)));
  const stLabel = helpers.stageLabel || (x => x.status === 'open' ? 'Open' : 'Completed');
  const who = helpers.empName || (x => x.assignedName || '');
  const wlHead = ['Date', 'WO #', 'Unit', 'Equipment', 'Type', 'Status', 'Problem / work', 'Parts used', 'Meter', 'Labor hrs', 'Parts $', 'Labor $', 'Other $', 'Total $', 'Vendor / tech', 'Assigned to', 'Priority', 'Due', 'Requested by', 'Work performed'];
  const wl = { name: 'Work Log', cols: [12, 10, 10, 26, 11, 15, 48, 30, 10, 9, 12, 12, 12, 13, 22, 18, 10, 12, 18, 44], cells: [], freeze: { row: 1, col: 0 } };
  wlHead.forEach((h, c) => wl.cells.push({ r: 0, c, v: h, head: true }));
  recs.forEach((x, i) => {
    const r = i + 1, u = byId[x.unitId];
    const row = [
      { date: x.date, fmt: DATE }, { v: wo(x) }, { v: label(x) }, { v: u ? (u.name || u.type || '') : '' },
      { v: x.kind || '' }, { v: stLabel(x), tone: x.status === 'open' ? 'warn' : null }, { v: x.description || '', wrap: true }, { v: x.parts || '', wrap: true },
      { v: num(x.meter), fmt: INT }, { v: num(x.laborHours) }, { v: num(x.partsCost) || 0, fmt: MONEY }, { v: num(x.laborCost) || 0, fmt: MONEY },
      { v: num(x.otherCost) || 0, fmt: MONEY }, { f: `SUM(K${r + 1}:M${r + 1})`, fmt: MONEY, bold: true }, { v: x.vendor || '' },
      { v: who(x) }, { v: x.priority || '' }, x.dueDate ? { date: x.dueDate, fmt: DATE } : { v: '' }, { v: x.requestedBy || '' }, { v: x.workDone || '', wrap: true }];
    row.forEach((cell, c) => wl.cells.push(Object.assign({ r, c }, cell)));
  });
  const last = Math.max(recs.length + 1, 2);
  wl.autoFilter = `A1:T${last}`;

  /* ---- Units ---- */
  const us = units.slice().sort((a, b) => String(a.unit).localeCompare(String(b.unit), undefined, { numeric: true }));
  const uHead = ['Unit', 'Description', 'Type', 'Make', 'Model', 'Year', 'Serial / VIN', 'Status', 'Meter', 'Meter type', 'PM every', 'PM every (days)', 'PM status (at export)', 'Notes'];
  const ut = { name: 'Units', cols: [10, 28, 16, 14, 14, 7, 18, 13, 10, 10, 10, 13, 30, 36], cells: [], freeze: { row: 1, col: 1 } };
  uHead.forEach((h, c) => ut.cells.push({ r: 0, c, v: h, head: true }));
  us.forEach((u, i) => {
    const r = i + 1, pm = pmText(u);
    [{ v: u.unit, bold: true }, { v: u.name || '' }, { v: u.type || '' }, { v: u.make || '' }, { v: u.model || '' }, { v: u.year || '' }, { v: u.serial || '' },
     { v: u.status || 'Running', tone: u.status === 'Down' ? 'bad' : u.status === 'Out of service' ? 'muted' : 'ok' },
     { v: helpers.curMeter(u) || null, fmt: INT }, { v: u.meterType || '' }, { v: num(u.pmMeter), fmt: INT }, { v: num(u.pmDays) },
     { v: pm ? pm.text : '', tone: pm ? pm.level : null }, { v: u.notes || '', wrap: true }]
      .forEach((cell, c) => ut.cells.push(Object.assign({ r, c }, cell)));
  });
  ut.autoFilter = `A1:N${Math.max(us.length + 1, 2)}`;

  /* ---- Dashboard ---- */
  const R = 5000, W = n => `'Work Log'!$${n}$2:$${n}$${R}`;
  const D = W('A'), UN = W('C'), TY = W('E'), ST = W('F'), TOT = W('N'), WHO = W('P'), DUE = W('R');
  const db = { name: 'Dashboard', cols: [14, 30, 14, 34, 9, 14, 16, 16, 16, 13], cells: [] };
  db.cells.push({ r: 0, c: 0, v: 'Fleet Maintenance Log', title: true });
  db.cells.push({ r: 1, c: 0, v: `Exported ${todayIso}. Dollar figures and counts are formulas over the Work Log and Units tabs, so they update if you add or edit rows there.`, muted: true });
  const kpis = [
    ['Units', `COUNTA(Units!$A$2:$A$${R})`, INT],
    ['Down now', `COUNTIF(Units!$H$2:$H$${R},"Down")`, INT],
    ['Open work orders', `COUNTIFS(${ST},"<>Completed",${ST},"<>")`, INT],
    ['This month', `SUMIFS(${TOT},${D},">="&DATE(YEAR(TODAY()),MONTH(TODAY()),1))`, MONEY0],
    ['Year to date', `SUMIFS(${TOT},${D},">="&DATE(YEAR(TODAY()),1,1))`, MONEY0],
    ['All time', `SUM(${TOT})`, MONEY0]];
  // KPI tiles laid out in pairs of columns: A, C, F, H … keep simple: one per column A..F
  const kc = [0, 2, 4, 6, 7, 8];
  kpis.forEach(([l, f, fmt], i) => { db.cells.push({ r: 3, c: kc[i], v: l, kpiLabel: true }); db.cells.push({ r: 4, c: kc[i], f, fmt, kpi: true }); });

  // Cost by unit
  let r = 6;
  db.cells.push({ r, c: 0, v: 'Cost by unit', section: true });
  r++;
  const cuHead = ['Unit', 'Equipment', 'Status', 'PM status (at export)', 'Jobs', 'Repairs $', 'Service & insp. $', 'This year $', 'All time $', 'Last work'];
  cuHead.forEach((h, c) => db.cells.push({ r, c, v: h, head: true }));
  const labels = us.map(u => ({ unit: u.unit, name: u.name || u.type || '', status: u.status || 'Running', pm: pmText(u) }));
  const known = new Set(us.map(u => u.unit));
  [...new Set(recs.map(label))].filter(l => !known.has(l)).forEach(l => labels.push({ unit: l, name: '(removed from fleet)', status: '', pm: null }));
  const first = r + 2;
  labels.forEach(L => {
    r++; const a = `$A${r + 1}`;
    [{ v: L.unit, bold: true }, { v: L.name }, { v: L.status, tone: L.status === 'Down' ? 'bad' : L.status === 'Running' ? 'ok' : 'muted' },
     { v: L.pm ? L.pm.text : '', tone: L.pm ? L.pm.level : null },
     { f: `COUNTIF(${UN},${a})`, fmt: INT },
     { f: `SUMIFS(${TOT},${UN},${a},${TY},"Repair")`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${UN},${a},${TY},"<>Repair")`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${UN},${a},${D},">="&DATE(YEAR(TODAY()),1,1))`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${UN},${a})`, fmt: MONEY, bold: true },
     { f: `IFERROR(LOOKUP(2,1/(${UN}=${a}),${D}),"")`, fmt: DATE }]
      .forEach((cell, c) => db.cells.push(Object.assign({ r, c }, cell)));
  });
  if (!labels.length) { r++; db.cells.push({ r, c: 0, v: 'No units yet. Add units in the app, then export again.', muted: true }); }
  else {
    const lastU = r + 1; r++;
    db.cells.push({ r, c: 0, v: 'Total', bold: true, totalRow: true });
    for (let c = 4; c <= 8; c++) { const L2 = colL(c); db.cells.push({ r, c, f: `SUM(${L2}${first}:${L2}${lastU})`, fmt: c === 4 ? INT : MONEY, bold: true, totalRow: true }); }
  }

  // Open work orders by person
  const people = (helpers.employees || []).map(e => e.name).filter(Boolean).sort((a, b) => a.localeCompare(b));
  recs.forEach(x => { const n = who(x); if (n && people.indexOf(n) === -1) people.push(n); });
  if (people.length || recs.some(x => x.status === 'open')) {
    r += 2;
    db.cells.push({ r, c: 0, v: 'Open work orders by person', section: true });
    r++;
    ['Person', 'Open', 'Overdue'].forEach((h, c) => db.cells.push({ r, c, v: h, head: true }));
    const openCrit = `${ST},"<>Completed",${ST},"<>"`;
    const pFirst = r + 2;
    people.forEach(n => {
      r++; const a = `$A${r + 1}`;
      db.cells.push({ r, c: 0, v: n, bold: true });
      db.cells.push({ r, c: 1, f: `COUNTIFS(${WHO},${a},${openCrit})`, fmt: INT });
      db.cells.push({ r, c: 2, f: `COUNTIFS(${WHO},${a},${openCrit},${DUE},"<"&TODAY(),${DUE},"<>")`, fmt: INT });
    });
    const pLast = r + 1; r++;
    const sumP = col => people.length ? `-SUM(${col}${pFirst}:${col}${pLast})` : '';
    db.cells.push({ r, c: 0, v: 'Unassigned', bold: true, muted: true });
    db.cells.push({ r, c: 1, f: `COUNTIFS(${openCrit})${sumP('B')}`, fmt: INT });
    db.cells.push({ r, c: 2, f: `COUNTIFS(${openCrit},${DUE},"<"&TODAY(),${DUE},"<>")${sumP('C')}`, fmt: INT });
  }

  // Cost by month (last 12 months)
  r += 2;
  db.cells.push({ r, c: 0, v: 'Cost by month (last 12 months)', section: true });
  r++;
  ['Month', 'Repairs $', 'Service & insp. $', 'Total $', 'Jobs'].forEach((h, c) => db.cells.push({ r, c, v: h, head: true }));
  const [ty, tm] = todayIso.split('-').map(Number);
  const mFirst = r + 2;
  for (let k = 11; k >= 0; k--) {
    r++; let y = ty, m = tm - k; while (m < 1) { m += 12; y--; }
    const iso = `${y}-${String(m).padStart(2, '0')}-01`, a = `$A${r + 1}`;
    const rng = `${D},">="&${a},${D},"<"&EDATE(${a},1)`;
    [{ date: iso, fmt: MONTH, bold: true },
     { f: `SUMIFS(${TOT},${rng},${TY},"Repair")`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${rng},${TY},"<>Repair")`, fmt: MONEY },
     { f: `SUMIFS(${TOT},${rng})`, fmt: MONEY, bold: true },
     { f: `COUNTIFS(${rng})`, fmt: INT }]
      .forEach((cell, c) => db.cells.push(Object.assign({ r, c }, cell)));
  }
  const mLast = r + 1; r++;
  db.cells.push({ r, c: 0, v: '12-month total', bold: true, totalRow: true });
  for (let c = 1; c <= 4; c++) { const L2 = colL(c); db.cells.push({ r, c, f: `SUM(${L2}${mFirst}:${L2}${mLast})`, fmt: c === 4 ? INT : MONEY, bold: true, totalRow: true }); }
  r += 2;
  db.cells.push({ r, c: 0, v: 'Tip: on the Work Log tab, use the filter arrows (Status, Assigned to, a single Unit, or a Type) to see just those jobs.', muted: true });

  return [db, wl, ut];
}

/* ---------- Excel export ---------- */
let excelLib=null;
function loadExcel(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(excelLib)return excelLib;
  excelLib=new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    sc.onload=()=>ok(window.ExcelJS);sc.onerror=()=>{excelLib=null;no(new Error("load"))};document.head.appendChild(sc)});
  return excelLib;
}
async function exportExcel(btn){
  if(!S.units.length&&!S.records.length){toast("Nothing to export yet. Add a unit and log some work first.");return}
  const old=btn?btn.textContent:"";if(btn){btn.disabled=true;btn.textContent="Building Excel…"}
  try{
    const ExcelJS=await loadExcel();
    const sheets=fleetWorkbookSpec(S.units,S.records,today(),{total,wo,meterUnit,curMeter,pmText:pmStatus,stageLabel,empName,employees:S.employees});
    const wb=new ExcelJS.Workbook();wb.creator="Fleet Maintenance Log";wb.created=new Date();
    const F="Arial",STEEL="FF26303A",ORANGE="FFC2410C",TONE={ok:"FF2C7A4B",bad:"FFB42318",warn:"FFA86A12",muted:"FF6B6E73"};
    for(const sp of sheets){
      const ws=wb.addWorksheet(sp.name,{views:sp.freeze?[{state:"frozen",ySplit:sp.freeze.row,xSplit:sp.freeze.col}]:[{showGridLines:sp.name!=="Dashboard"}]});
      sp.cols.forEach((w,i)=>ws.getColumn(i+1).width=w);
      for(const c of sp.cells){
        const cell=ws.getCell(c.r+1,c.c+1);
        if(c.f!=null)cell.value={formula:c.f};
        else if(c.date){const[y,m,d]=c.date.split("-").map(Number);cell.value=new Date(Date.UTC(y,m-1,d))}
        else if(c.v!=null&&c.v!=="")cell.value=c.v;
        if(c.fmt)cell.numFmt=c.fmt;
        const font={name:F,size:10};
        if(c.bold)font.bold=true;
        if(c.tone&&TONE[c.tone]){font.color={argb:TONE[c.tone]};font.bold=true}
        if(c.muted){font.color={argb:TONE.muted};font.italic=true}
        if(c.title){font.size=18;font.bold=true;font.color={argb:STEEL}}
        if(c.section){font.size=12;font.bold=true;font.color={argb:STEEL};cell.border={bottom:{style:"medium",color:{argb:ORANGE}}}}
        if(c.kpiLabel){font.size=9;font.bold=true;font.color={argb:TONE.muted}}
        if(c.kpi){font.size=16;font.bold=true;font.color={argb:STEEL}}
        if(c.head){font.bold=true;font.color={argb:"FFFFFFFF"};cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:STEEL}};cell.alignment={vertical:"middle",wrapText:true}}
        if(c.totalRow)cell.border={top:{style:"thin",color:{argb:STEEL}}};
        if(c.wrap)cell.alignment={wrapText:true,vertical:"top"};
        cell.font=font;
      }
      if(sp.autoFilter)ws.autoFilter=sp.autoFilter;
      if(sp.name!=="Dashboard")ws.getRow(1).height=20;
    }
    const buf=await wb.xlsx.writeBuffer();
    await S.dl.save({filename:`Fleet-Maintenance-${today()}.xlsx`,data:new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})});
  }catch(e){toast(e&&e.message==="load"?"Couldn't load the Excel builder. Check your connection and try again.":"Couldn't build the Excel file.")}
  finally{if(btn){btn.disabled=false;btn.textContent=old}}
}


/* ---------- Work orders ---------- */
function renderOrders(){
  const v=$("#view"),f=S.wo,me=S.me&&empById(S.me)?S.me:"";
  if(S.status==="loading"&&!S.records.length){v.innerHTML=`<div class="empty"><p>Loading work orders…</p></div>`;return}
  if(f.view==="mine"&&!me)f.view="open";
  const openAll=S.records.filter(r=>r.status==="open");
  const cutoff=iso(new Date(Date.now()-30*864e5));
  const views=[["open","All open",openAll.length]].concat(me?[["mine","My jobs",openAll.filter(r=>r.assignedTo===me).length]]:[],
    [["unassigned","Unassigned",openAll.filter(r=>!r.assignedTo).length],["done","Done · 30 days",null]]);
  let list;
  if(f.view==="done")list=S.records.filter(r=>r.status!=="open"&&(r.date||"")>=cutoff).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  else list=openAll.filter(r=>f.view==="mine"?r.assignedTo===me:f.view==="unassigned"?!r.assignedTo:true)
    .sort((a,b)=>(isOverdue(b)-isOverdue(a))||(priRank(a.priority)-priRank(b.priority))||((a.dueDate||"9999").localeCompare(b.dueDate||"9999"))||((a.date||"").localeCompare(b.date||"")));
  const emps=sortedEmps();
  const meRow=`<div class="me-row"><span>This phone belongs to</span>${emps.length?`<select id="meSel" aria-label="Who uses this phone"><option value="">Choose your name…</option>${emps.map(e=>`<option value="${h(e.id)}" ${me===e.id?"selected":""}>${h(e.name)}</option>`).join("")}</select>`:`<span>— add your team first</span>`}<span class="sp" style="flex:1"></span>${S.canWrite?`<button class="btn small" id="teamBtn" type="button">Team${emps.length?` (${emps.length})`:""}</button>`:""}</div>`;
  const chips=`<div class="toolbar"><div class="chips" role="group" aria-label="Show">${views.map(([k,l,n])=>`<button class="chip" type="button" data-view="${k}" aria-pressed="${f.view===k}">${l}${n!=null?` <span class="n">${n}</span>`:""}</button>`).join("")}</div></div>`;
  const card=r=>{const u=unitById(r.unitId);return`<button class="wo" type="button" data-wo="${h(r.id)}" data-pri="${h(r.priority||"Normal")}">
    <div class="wo-top"><span class="tag">${h(unitLabel(r.unitId))}</span><span class="wo-title">${h(r.description||"(no description)")}</span>${r.priority==="Urgent"||r.priority==="High"?`<span class="pri ${h(r.priority)}">${h(r.priority)}</span>`:""}</div>
    <div class="wo-meta">${whoHtml(r)}${dueHtml(r)}<span class="kind ${h(r.kind)}">${h(r.kind)}</span><span class="mono">${wo(r)}</span></div></button>`};
  let body;
  if(f.view==="done")body=list.length?rowsHtml(list):`<div class="empty"><p>No work orders completed in the last 30 days.</p></div>`;
  else if(!list.length){
    const msg=f.view==="mine"?"Nothing is assigned to you right now.":f.view==="unassigned"?"Every open work order has someone on it.":"No open work orders.";
    body=`<div class="empty"><h3>${msg}</h3><p>${f.view==="open"?"Tap + Work order to write one up, assign it to someone and send it to their phone.":""}</p>${S.canWrite&&f.view==="open"?`<button class="btn primary" id="woFirst" type="button">+ Work order</button>`:""}</div>`;
  }else body=STAGES.map(([k,l])=>{const g=list.filter(r=>stageOf(r)===k);return g.length?`<section class="wo-group"><h3>${l} <b>${g.length}</b></h3><div class="wos">${g.map(card).join("")}</div></section>`:""}).join("");
  v.innerHTML=meRow+chips+body;
  v.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{f.view=b.dataset.view;renderOrders()});
  v.querySelectorAll("[data-wo]").forEach(b=>b.onclick=()=>woDetail(b.dataset.wo));
  bindRows(v);
  const ms=$("#meSel");if(ms)ms.onchange=()=>{S.me=ms.value;try{localStorage.setItem("fml-me",S.me)}catch(_){}if(S.me){f.view="mine";toast("This phone is set to "+empById(S.me).name)}renderOrders()};
  const tb=$("#teamBtn");if(tb)tb.onclick=()=>teamSheet();
  const wf=$("#woFirst");if(wf)wf.onclick=()=>workForm();
}

function woDetail(id,opt={}){
  const r=S.records.find(x=>x.id===id);if(!r){toast("That work order wasn't found. It may have been deleted.");return}
  const u=unitById(r.unitId),st=stageOf(r),emp=r.assignedTo&&empById(r.assignedTo),name=empName(r),me=S.me&&empById(S.me)?S.me:"";
  const open=r.status==="open",cw=S.canWrite;
  const msg=woMessage(r),subj=`Work order ${wo(r)} – ${unitLabel(r.unitId)}`;
  const ph=emp&&phoneDigits(emp.phone),em=emp&&emp.email;
  const dl=[["Unit",`${unitLabel(r.unitId)}${u&&u.name?" — "+u.name:""}`],["Type",r.kind],["Assigned to",name||"Unassigned"],["Requested by",r.requestedBy],["Source",r.source],["Reported again",r.checkLog],
    ["Opened",fmtDate(r.date)],["Due",r.dueDate?fmtDate(r.dueDate):""],["Meter",r.meter?numv(r.meter).toLocaleString()+" "+meterUnit(u):""],
    ["Work performed",r.workDone],["Parts used",partsOf(r).map(p=>[p.qty?p.qty+" ×":"",p.no,p.desc,p.cost?"— "+money(numv(p.cost)):""].filter(Boolean).join(" ")).join("\n")],["Labor hours",r.laborHours||""],["Vendor / tech",r.vendor],
    ["Cost",total(r)?money(total(r)):""],["Completed",r.completedAt?fmtDate(String(r.completedAt).slice(0,10)):""]].filter(x=>x[1]);
  openSheet(`${wo(r)} · ${h(unitLabel(r.unitId))}`,`
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="stage ${st}">${h(stageLabel(r))}</span>${r.priority&&r.priority!=="Normal"?`<span class="pri ${h(r.priority)}">${h(r.priority)} priority</span>`:""}${dueHtml(r)}</div>
    <p class="wo-desc">${h(r.description||"(no description)")}</p>
    ${open&&cw?`<div class="f"><span class="lbl">Update status</span><div class="seg wrap4" id="dStage">${STAGES.map(([k,l])=>`<button type="button" data-s="${k}" aria-pressed="${st===k}">${k==="waiting"?"Waiting parts":l}</button>`).join("")}</div></div>
      <div class="actions">${me&&r.assignedTo!==me?`<button class="btn" id="dMine" type="button">Assign to me</button>`:""}<button class="btn primary" id="dDone" type="button">Complete job…</button></div>`:""}
    <dl class="dl">${dl.map(([k,v])=>`<dt>${k}</dt><dd>${h(v)}</dd>`).join("")}</dl>
    <div class="share-box ${opt.notify?"notify":""}">
      <span class="lbl">${opt.notify&&name?`Let ${h(name)} know`:"Send this work order"}</span>
      <div class="actions">
        ${ph?`<a class="btn ${opt.notify?"primary":""}" href="sms:${h(ph)}?body=${encodeURIComponent(msg)}">Text ${h(emp.name.split(" ")[0])}</a>`:""}
        ${em?`<a class="btn ${opt.notify&&!ph?"primary":""}" href="mailto:${h(em)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(msg)}">Email ${h(emp.name.split(" ")[0])}</a>`:""}
        ${navigator.share?`<button class="btn" id="dShare" type="button">Share…</button>`:""}
        <button class="btn" id="dCopy" type="button">Copy link</button>
        <button class="btn" id="dPrint" type="button">Print</button>
      </div>
      ${emp&&!ph&&!em?`<span class="note">Add a phone number for ${h(emp.name)} under Team to text work orders straight to them.</span>`:""}
    </div>`,
    `${cw?`<button class="btn small" id="dEdit" type="button">Edit</button>`:""}<span class="sp"></span><button class="btn" data-close type="button">Close</button>`,
    sc=>{
      const upd=async(data,label)=>{try{await S.db.collection("records").doc(r.id).update(Object.assign({updatedAt:new Date().toISOString()},data));toast(label);if($("#scrim"))woDetail(r.id)}catch(e){toast(errMsg(e))}};
      sc.querySelectorAll("#dStage button").forEach(b=>b.onclick=()=>{if(b.getAttribute("aria-pressed")==="true")return;
        sc.querySelectorAll("#dStage button").forEach(x=>x.setAttribute("aria-pressed",x===b));
        const k=b.dataset.s,extra=k==="in_progress"&&!r.assignedTo&&me?{assignedTo:me,assignedName:empById(me).name}:{};
        upd(Object.assign({stage:k},extra),`${wo(r)} marked ${k==="waiting"?"waiting on parts":k==="in_progress"?"in progress":"open"}`)});
      const dm=$("#dMine");if(dm)dm.onclick=()=>upd({assignedTo:me,assignedName:empById(me).name},`${wo(r)} assigned to you`);
      const dd=$("#dDone");if(dd)dd.onclick=()=>workForm({recId:r.id,complete:true});
      const de=$("#dEdit");if(de)de.onclick=()=>workForm({recId:r.id});
      const ds=$("#dShare");if(ds)ds.onclick=async()=>{try{await navigator.share({title:subj,text:msg})}catch(_){}};
      $("#dCopy").onclick=async()=>{const link=woLink(r);try{await navigator.clipboard.writeText(link);toast("Link copied")}catch(_){openSheet("Copy link",`<textarea class="copybox" id="cb" readonly style="min-height:80px">${h(link)}</textarea>`,`<span class="sp"></span><button class="btn" data-close type="button">Done</button>`,()=>{const c=$("#cb");c.focus();c.select()})}};
      $("#dPrint").onclick=()=>printWO(r);
    });
}

function printWO(r){
  const u=unitById(r.unitId)||{};const e=h;
  const partRows=partsOf(r).slice(0,12);
  const blankRows=n=>Array.from({length:n},()=>`<tr><td>&nbsp;</td><td></td><td></td><td></td></tr>`).join("");
  $("#printArea").innerHTML=`<div class="pwo">
    <div class="hd"><div><h1>Work Order</h1><div>Fleet Maintenance Log</div></div><div class="won">${e(wo(r))}</div></div>
    <table>
      <tr><th>Unit</th><td><b>${e(unitLabel(r.unitId))}</b> ${e(u.name||u.type||"")}</td><th>Opened</th><td>${e(fmtDate(r.date))}</td></tr>
      <tr><th>Make / model</th><td>${e([u.make,u.model,u.year].filter(Boolean).join(" "))}</td><th>Serial</th><td>${e(u.serial||"")}</td></tr>
      <tr><th>Type</th><td>${e(r.kind||"")}</td><th>Priority</th><td>${e(r.priority||"Normal")}</td></tr>
      <tr><th>Assigned to</th><td>${e(empName(r)||"")}</td><th>Due</th><td>${e(r.dueDate?fmtDate(r.dueDate):"")}</td></tr>
      <tr><th>Requested by</th><td>${e(r.requestedBy||"")}</td><th>Status</th><td>${e(stageLabel(r))}</td></tr>
    </table>
    <h2>Problem / work requested</h2><div class="box">${e(r.description||"")}</div>
    <h2>Work performed</h2>${r.workDone?`<div class="box">${e(r.workDone)}</div>`:`<div class="lines">${"<div></div>".repeat(5)}</div>`}
    <h2>Parts used</h2><table><tr><th style="width:10%">Qty</th><th style="width:22%">Part #</th><th>Description</th><th style="width:16%">Cost</th></tr>${partRows.map(p=>`<tr><td>${e(p.qty)}</td><td>${e(p.no)}</td><td>${e(p.desc)}</td><td>${String(p.cost).trim()?"$"+numv(p.cost).toFixed(2):""}</td></tr>`).join("")}${blankRows(Math.max(2,5-partRows.length))}${numv(r.partsCost)?`<tr><td colspan="3" style="text-align:right;font-weight:bold">Parts total</td><td><b>${money(numv(r.partsCost))}</b></td></tr>`:""}</table>
    <table><tr><th>Labor hours</th><td>${e(r.laborHours||"")}</td><th>Meter at finish</th><td>${e(r.meter||"")} ${e(meterUnit(u))}</td></tr></table>
    <div class="sig"><div>Technician signature &nbsp;/&nbsp; date</div><div>Supervisor sign-off &nbsp;/&nbsp; date</div></div>
    <div class="ft">Printed ${e(fmtDate(today()))} · ${e(woLink(r))}</div></div>`;
  setTimeout(()=>window.print(),50);
}

function teamSheet(editId){
  const emps=sortedEmps(),ed=editId?empById(editId):null;
  const openCount=id=>S.records.filter(r=>r.status==="open"&&r.assignedTo===id).length;
  openSheet("Team",`
    <p class="note" style="margin:0">People you can assign work orders to. Add a cell number to text them their jobs.</p>
    <div>${emps.length?emps.map(e=>`<div class="team-row"><span class="av" style="width:34px;height:34px;font-size:.8rem">${h(initials(e.name))}</span><div class="nm"><b>${h(e.name)}</b>${e.role?` · ${h(e.role)}`:""}<small>${h([e.phone,e.email].filter(Boolean).join(" · ")||"No contact info")} · ${openCount(e.id)} open</small></div><button class="btn small" type="button" data-edit="${h(e.id)}">Edit</button></div>`).join(""):`<p class="note">No one added yet.</p>`}</div>
    <div class="section-lbl">${ed?`Edit ${h(ed.name)}`:"Add a person"}</div>
    <div class="g2"><div class="f"><label for="eName">Name</label><input type="text" id="eName" value="${h(ed?ed.name:"")}" placeholder="e.g. Mike Johnson" autocomplete="off"></div>
      <div class="f"><label for="eRole">Role</label><input type="text" id="eRole" value="${h(ed?ed.role||"":"")}" placeholder="e.g. Mechanic"></div></div>
    <div class="g2"><div class="f"><label for="ePhone">Cell phone</label><input type="tel" id="ePhone" value="${h(ed?ed.phone||"":"")}" placeholder="910-555-0123" autocomplete="off"></div>
      <div class="f"><label for="eEmail">Email</label><input type="email" id="eEmail" value="${h(ed?ed.email||"":"")}" placeholder="optional" autocomplete="off"></div></div>
    <div class="err" id="eErr" role="alert"></div>`,
    `${ed?`<button class="btn danger small" id="eDel" type="button">Remove</button><button class="btn ghost small" id="eNew" type="button">Cancel edit</button>`:""}<span class="sp"></span><button class="btn ghost" data-close type="button">Done</button><button class="btn primary" id="eSave" type="button">${ed?"Save":"Add person"}</button>`,
    sc=>{
      sc.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>teamSheet(b.dataset.edit));
      const nw=$("#eNew");if(nw)nw.onclick=()=>teamSheet();
      const del=$("#eDel");if(del){let armed=false;del.onclick=async()=>{if(!armed){armed=true;del.textContent="Tap again to remove";return}
        del.disabled=true;try{await S.db.collection("employees").doc(ed.id).delete();if(S.me===ed.id){S.me="";try{localStorage.removeItem("fml-me")}catch(_){}}toast(`${ed.name} removed. Their past work orders keep their name.`);teamSheet()}catch(e){$("#eErr").textContent=errMsg(e);del.disabled=false}}}
      $("#eSave").onclick=async()=>{
        const name=$("#eName").value.trim();if(!name){$("#eErr").textContent="Enter the person's name.";$("#eName").focus();return}
        if(S.employees.some(x=>x.name.toLowerCase()===name.toLowerCase()&&(!ed||x.id!==ed.id))){$("#eErr").textContent=`${name} is already on the team.`;return}
        const data={name,role:$("#eRole").value.trim(),phone:$("#ePhone").value.trim(),email:$("#eEmail").value.trim(),createdAt:ed?ed.createdAt:new Date().toISOString()};
        const btn=$("#eSave");btn.disabled=true;btn.textContent="Saving…";
        try{const col=S.db.collection("employees");await (ed?col.doc(ed.id):col.doc()).set(data);toast(ed?"Saved":`${name} added`);teamSheet()}
        catch(e){$("#eErr").textContent=errMsg(e);btn.disabled=false;btn.textContent=ed?"Save":"Add person"}
      };
      if(!ed)setTimeout(()=>{const n=$("#eName");if(n&&!emps.length)n.focus()},50);
    });
}

/* ---------- Sheet ---------- */
function openSheet(title,body,foot,mount){
  $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${h(title)}"><div class="sheet-h"><h2>${title}</h2><button class="x" data-close type="button" aria-label="Close">×</button></div><div class="sheet-b">${body}</div>${foot?`<div class="sheet-f">${foot}</div>`:""}</div></div>`;
  const sc=$("#scrim");sc.addEventListener("mousedown",e=>{if(e.target===sc)closeSheet()});
  sc.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  document.body.style.overflow="hidden";
  if(mount)mount(sc);
}
function closeSheet(){$("#sheetRoot").innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#scrim"))closeSheet()});

/* ---------- Work form ---------- */
function workForm({recId,unitId,complete}={}){
  if(!S.db){toast("Data isn't available in this view");return}
  if(!S.units.length){unitForm();toast("Add a unit first, then write up work orders for it");return}
  const ex=recId?S.records.find(r=>r.id===recId):null;
  const r=ex||{unitId:unitId||(S.hist.unit!=="all"?S.hist.unit:""),kind:"Repair",date:today(),status:"open",stage:"open",priority:"Normal",
    assignedTo:S.tab==="orders"&&S.wo.view==="mine"&&S.me?S.me:""};
  let kind=r.kind||"Repair",pri=r.priority||"Normal",st=complete?"done":stageOf(r);
  const wasOpen=!ex||ex.status==="open";
  const date0=complete&&wasOpen?today():r.date;
  const ro=!S.canWrite,dis=ro?"disabled":"";
  const emps=sortedEmps();
  const STG=[["open","Open"],["in_progress","In progress"],["waiting","Waiting parts"],["done","Completed"]];
  openSheet(ex?(complete?`Complete ${wo(ex)}`:`Edit ${wo(ex)}`)+` · ${h(unitLabel(ex.unitId))}`:"New work order",`
    <div class="f"><label for="wUnit">Unit</label><select id="wUnit" ${dis}><option value="">Choose a unit…</option>${sortedUnits().map(u=>`<option value="${h(u.id)}" ${r.unitId===u.id?"selected":""}>${h(u.unit)} — ${h(u.name||u.type||"")}</option>`).join("")}</select></div>
    <div class="f"><span class="lbl">Type of work</span><div class="seg" id="wKind">${KINDS.map(k=>`<button type="button" aria-pressed="${k===kind}" data-k="${k}" ${dis}>${k}</button>`).join("")}</div></div>
    <div class="f"><label for="wDesc">Problem / work to do</label><textarea id="wDesc" placeholder="e.g. Hydraulic leak at tilt cylinder, mast drifts down when parked" ${dis}>${h(r.description||"")}</textarea></div>
    <div class="g2"><div class="f"><label for="wWho">Assign to</label><select id="wWho" ${dis}><option value="">Unassigned</option>${emps.map(e=>`<option value="${h(e.id)}" ${r.assignedTo===e.id?"selected":""}>${h(e.name)}</option>`).join("")}</select>${emps.length?"":`<span class="hint">Add people under Work orders → Team.</span>`}</div>
      <div class="f"><label for="wPri">Priority</label><select id="wPri" ${dis}>${PRIS.map(p=>`<option ${pri===p?"selected":""}>${p}</option>`).join("")}</select></div></div>
    <div class="g2"><div class="f"><label for="wDue">Due date</label><input type="date" id="wDue" value="${h(r.dueDate||"")}" ${dis}></div>
      <div class="f"><label for="wReq">Requested by</label><input type="text" id="wReq" value="${h(r.requestedBy||"")}" placeholder="Who reported it" ${dis}></div></div>
    <div class="f"><span class="lbl">Status</span><div class="seg wrap4" id="wStat">${STG.map(([k,l])=>`<button type="button" data-s="${k}" aria-pressed="${st===k}" ${dis}>${l}</button>`).join("")}</div></div>
    <div class="section-lbl">Work done &amp; cost <span class="hint" style="text-transform:none;letter-spacing:0;font-family:var(--body)">· fill in when the job is finished</span></div>
    <div class="f"><label for="wDone">Work performed</label><textarea id="wDone" placeholder="e.g. Replaced hose on tilt cylinder, topped off hydraulic fluid, tested" ${dis}>${h(r.workDone||"")}</textarea></div>
    <div class="g2"><div class="f"><label for="wDate" id="wDateL">${st==="done"?"Date completed":"Date opened"}</label><input type="date" id="wDate" value="${h(date0)}" ${dis}></div>
      <div class="f"><label for="wMeter">Meter reading <span id="wMU"></span></label><input type="number" id="wMeter" inputmode="decimal" min="0" step="any" value="${h(r.meter||"")}" placeholder="e.g. 4210" ${dis}></div></div>
    <div class="f"><span class="lbl">Parts used</span>
      <div class="phead" id="pHead"><span>Qty</span><span>Part #</span><span>Cost $</span><span></span></div>
      <div class="plist" id="pList"></div>
      ${ro?"":`<button class="btn small" id="pAdd" type="button" style="align-self:flex-start">+ Add part</button>`}</div>
    <div class="g3"><div class="f"><label for="wPC">Parts $ <span class="hint" id="pcHint" style="text-transform:none;letter-spacing:0"></span></label><input type="number" id="wPC" inputmode="decimal" min="0" step="0.01" value="${h(r.partsCost||"")}" placeholder="0" ${dis}></div>
      <div class="f"><label for="wLC">Labor $</label><input type="number" id="wLC" inputmode="decimal" min="0" step="0.01" value="${h(r.laborCost||"")}" placeholder="0" ${dis}></div>
      <div class="f"><label for="wOC">Other $</label><input type="number" id="wOC" inputmode="decimal" min="0" step="0.01" value="${h(r.otherCost||"")}" placeholder="0" ${dis}></div></div>
    <div class="g2"><div class="f"><label for="wLH">Labor hours</label><input type="number" id="wLH" inputmode="decimal" min="0" step="0.25" value="${h(r.laborHours||"")}" placeholder="0" ${dis}></div>
      <div class="f"><label for="wVen">Vendor / tech</label><input type="text" id="wVen" value="${h(r.vendor||"")}" placeholder="In-house, dealer…" ${dis}></div></div>
    <div class="total-line"><span class="lbl">Job total</span><b class="num" id="wTot">$0</b></div>
    <div class="err" id="wErr" role="alert"></div>`,
    ro?`<span class="sp"></span><button class="btn" data-close type="button">Close</button>`:
    `${ex?`<button class="btn danger small" id="wDel" type="button">Delete</button>`:""}<span class="sp"></span><button class="btn ghost" data-close type="button">Cancel</button><button class="btn primary" id="wSave" type="button">${ex?(complete?"Complete job":"Save changes"):"Save work order"}</button>`,
    sc=>{
      const upd=()=>{$("#wTot").textContent=money(numv($("#wPC").value)+numv($("#wLC").value)+numv($("#wOC").value));const u=unitById($("#wUnit").value);$("#wMU").textContent=u&&meterUnit(u)?`(${meterUnit(u)})`:""};
      let plist=partsOf(r);
      const pSum=()=>{const has=plist.some(p=>String(p.cost).trim()!=="");const pc=$("#wPC");
        if(has){pc.value=plist.reduce((a,p)=>a+numv(p.cost),0).toFixed(2);pc.readOnly=true;$("#pcHint").textContent="· from parts list"}
        else{pc.readOnly=false;$("#pcHint").textContent=""}upd()};
      const drawParts=()=>{const L=$("#pList");$("#pHead").hidden=!plist.length;
        L.innerHTML=plist.map((p,i)=>`<div class="prow" data-i="${i}">
          <input type="number" inputmode="decimal" min="0" step="any" aria-label="Quantity" data-k="qty" value="${h(p.qty)}" placeholder="1" ${dis}>
          <input type="text" aria-label="Part number" data-k="no" value="${h(p.no)}" placeholder="Part #" autocapitalize="characters" ${dis}>
          <input type="number" inputmode="decimal" min="0" step="0.01" aria-label="Cost" data-k="cost" value="${h(p.cost)}" placeholder="0.00" ${dis}>
          ${ro?"":`<button class="px" type="button" aria-label="Remove part" data-x="${i}">×</button>`}
          <input class="pdesc" type="text" aria-label="Description" data-k="desc" value="${h(p.desc)}" placeholder="Description, e.g. Oil filter" ${dis}></div>`).join("");
        L.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{plist[+inp.closest(".prow").dataset.i][inp.dataset.k]=inp.value;if(inp.dataset.k==="cost")pSum()});
        L.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{plist.splice(+b.dataset.x,1);drawParts();pSum()});};
      drawParts();
      const pa=$("#pAdd");if(pa)pa.onclick=()=>{plist.push({qty:"",no:"",desc:"",cost:""});drawParts();const rows=$("#pList").querySelectorAll(".prow");rows[rows.length-1].querySelector("[data-k=no]").focus()};
      ["wPC","wLC","wOC"].forEach(i=>$("#"+i).oninput=upd);$("#wUnit").onchange=upd;pSum();
      sc.querySelectorAll("#wKind button").forEach(b=>b.onclick=()=>{kind=b.dataset.k;sc.querySelectorAll("#wKind button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
      sc.querySelectorAll("#wStat button").forEach(b=>b.onclick=()=>{st=b.dataset.s;sc.querySelectorAll("#wStat button").forEach(x=>x.setAttribute("aria-pressed",x===b));
        $("#wDateL").textContent=st==="done"?"Date completed":"Date opened";
        if(st==="done"&&wasOpen&&ex)$("#wDate").value=today();});
      if(ro)return;
      if(complete)setTimeout(()=>$("#wDone").focus(),80);
      else if(!ex)setTimeout(()=>{(r.unitId?$("#wDesc"):$("#wUnit")).focus()},50);
      const del=$("#wDel");if(del){let armed=false;del.onclick=async()=>{if(!armed){armed=true;del.textContent="Tap again to delete";return}
        del.disabled=true;try{await S.db.collection("records").doc(ex.id).delete();closeSheet();toast(`${wo(ex)} deleted`)}catch(e){$("#wErr").textContent=errMsg(e);del.disabled=false}}}
      $("#wSave").onclick=async()=>{
        const unitId=$("#wUnit").value,desc=$("#wDesc").value.trim(),date=$("#wDate").value,who=$("#wWho").value;
        if(!unitId){$("#wErr").textContent="Choose which unit this is for.";return}
        if(!desc){$("#wErr").textContent="Describe the problem or the work to do.";$("#wDesc").focus();return}
        if(!date){$("#wErr").textContent="Enter the date.";return}
        const done=st==="done";
        const data={unitId,unitNumber:(unitById(unitId)||{}).unit||"",kind,date,status:done?"done":"open",stage:done?"done":st,
          description:desc,workDone:$("#wDone").value.trim(),priority:$("#wPri").value,
          assignedTo:who,assignedName:who?(empById(who)||{}).name||"":"",dueDate:$("#wDue").value||"",requestedBy:$("#wReq").value.trim(),
          parts:partsText(plist.filter(p=>p.desc.trim()||p.no.trim())),partsList:JSON.stringify(plist.filter(p=>p.desc.trim()||p.no.trim()).map(p=>({qty:String(p.qty).trim(),no:p.no.trim(),desc:p.desc.trim(),cost:String(p.cost).trim()}))),
          meter:numv($("#wMeter").value)||null,
          partsCost:numv($("#wPC").value),laborCost:numv($("#wLC").value),otherCost:numv($("#wOC").value),laborHours:numv($("#wLH").value)||null,
          vendor:$("#wVen").value.trim(),completedAt:done?(ex&&ex.completedAt&&ex.status!=="open"?ex.completedAt:new Date().toISOString()):"",
          createdAt:ex?ex.createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
        const btn=$("#wSave");btn.disabled=true;btn.textContent="Saving…";
        try{
          const col=S.db.collection("records"),ref=ex?col.doc(ex.id):col.doc();
          await ref.set(data);
          const u=unitById(unitId);
          if(u&&data.meter&&data.meter>numv(u.meter)){try{await S.db.collection("units").doc(u.id).update({meter:data.meter})}catch(_){}}
          const newlyAssigned=!done&&who&&(!ex||ex.assignedTo!==who);
          closeSheet();
          if(newlyAssigned){toast(`${wo({id:ref.id})} saved and assigned to ${data.assignedName}`);woDetail(ref.id,{notify:true})}
          else toast(done?`${wo({id:ref.id})} completed`:ex?"Changes saved":`${wo({id:ref.id})} saved`);
        }catch(e){$("#wErr").textContent=errMsg(e);btn.disabled=false;btn.textContent=ex?(complete?"Complete job":"Save changes"):"Save work order"}
      };
    });
}
function errMsg(e){const c=e&&e.code;
  if(c==="unauthorized")return"The shop code was rejected. Enter the correct code and save again.";
  if(c==="server")return"The log couldn't save that: "+(e.message||"unknown error");
  return"Couldn't save right now. Check your connection and try again.";}

/* ---------- Unit form ---------- */
function unitForm(id){
  if(!S.db){toast("Data isn't available in this view");return}
  const ex=id?unitById(id):null;const u=ex||{type:"Forklift",meterType:"Hours",status:"Running"};
  openSheet(ex?`Edit ${h(ex.unit)}`:"Add unit",`
    <div class="g2"><div class="f"><label for="uNum">Unit number</label><input type="text" id="uNum" value="${h(u.unit||"")}" placeholder="e.g. FL-07"></div>
      <div class="f"><label for="uType">Equipment type</label><select id="uType">${TYPES.map(t=>`<option ${u.type===t?"selected":""}>${t}</option>`).join("")}</select></div></div>
    <div class="f"><label for="uName">Description</label><input type="text" id="uName" value="${h(u.name||"")}" placeholder="e.g. 5,000 lb LP forklift, Bay 2"></div>
    <div class="g3"><div class="f"><label for="uMake">Make</label><input type="text" id="uMake" value="${h(u.make||"")}"></div>
      <div class="f"><label for="uModel">Model</label><input type="text" id="uModel" value="${h(u.model||"")}"></div>
      <div class="f"><label for="uYear">Year</label><input type="number" id="uYear" inputmode="numeric" value="${h(u.year||"")}"></div></div>
    <div class="f"><label for="uSer">Serial / VIN</label><input type="text" id="uSer" value="${h(u.serial||"")}"></div>
    <div class="g2"><div class="f"><label for="uMT">Meter</label><select id="uMT">${["Hours","Miles","None"].map(t=>`<option ${u.meterType===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="f"><label for="uM">Current reading</label><input type="number" id="uM" inputmode="decimal" min="0" step="any" value="${h(u.meter||"")}"></div></div>
    <div class="g2"><div class="f"><label for="uPM">PM every (hrs / mi)</label><input type="number" id="uPM" inputmode="decimal" min="0" value="${h(u.pmMeter||"")}" placeholder="e.g. 250"><span class="hint">Leave blank if not used</span></div>
      <div class="f"><label for="uPD">or every (days)</label><input type="number" id="uPD" inputmode="numeric" min="0" value="${h(u.pmDays||"")}" placeholder="e.g. 90"></div></div>
    <div class="f"><span class="lbl">Status</span><div class="seg" id="uStat">${["Running","Down","Out of service"].map(s=>`<button type="button" data-s="${s}" aria-pressed="${(u.status||"Running")===s}">${s}</button>`).join("")}</div></div>
    <div class="f"><label for="uNotes">Notes</label><textarea id="uNotes" placeholder="Location, filters, tire size, key info…">${h(u.notes||"")}</textarea></div>
    <div class="err" id="uErr" role="alert"></div>`,
    `${ex?`<button class="btn danger small" id="uDel" type="button">Remove unit</button>`:""}<span class="sp"></span><button class="btn ghost" data-close type="button">Cancel</button><button class="btn primary" id="uSave" type="button">${ex?"Save changes":"Add unit"}</button>`,
    sc=>{
      let status=u.status||"Running";
      sc.querySelectorAll("#uStat button").forEach(b=>b.onclick=()=>{status=b.dataset.s;sc.querySelectorAll("#uStat button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
      setTimeout(()=>$("#uNum").focus(),50);
      const del=$("#uDel");if(del){let armed=false;del.onclick=async()=>{if(!armed){armed=true;del.textContent="Tap again to remove";return}
        del.disabled=true;try{await S.db.collection("units").doc(ex.id).delete();closeSheet();toast(`${ex.unit} removed. Its job history stays in reports.`)}catch(e){$("#uErr").textContent=errMsg(e);del.disabled=false}}}
      $("#uSave").onclick=async()=>{
        const num=$("#uNum").value.trim();if(!num){$("#uErr").textContent="Give the unit a number or name, like FL-07.";$("#uNum").focus();return}
        if(S.units.some(x=>x.unit.toLowerCase()===num.toLowerCase()&&(!ex||x.id!==ex.id))){$("#uErr").textContent=`${num} is already in the fleet.`;return}
        const data={unit:num,type:$("#uType").value,name:$("#uName").value.trim(),make:$("#uMake").value.trim(),model:$("#uModel").value.trim(),year:$("#uYear").value.trim(),
          serial:$("#uSer").value.trim(),meterType:$("#uMT").value,meter:numv($("#uM").value)||null,pmMeter:numv($("#uPM").value)||null,pmDays:numv($("#uPD").value)||null,
          status,notes:$("#uNotes").value.trim(),createdAt:ex?ex.createdAt:new Date().toISOString()};
        const btn=$("#uSave");btn.disabled=true;btn.textContent="Saving…";
        try{const col=S.db.collection("units");await (ex?col.doc(ex.id):col.doc()).set(data);closeSheet();toast(ex?"Unit updated":`${num} added`)}
        catch(e){$("#uErr").textContent=errMsg(e);btn.disabled=false;btn.textContent=ex?"Save changes":"Add unit"}
      };
    });
}

/* ---------- Unit detail ---------- */
function unitDetail(id){
  const u=unitById(id);if(!u)return;
  const rs=recsFor(id).sort((a,b)=>b.date.localeCompare(a.date));const y=today().slice(0,4);
  const life=rs.reduce((s,r)=>s+total(r),0),ytd=rs.filter(r=>r.date.startsWith(y)).reduce((s,r)=>s+total(r),0),rep=rs.filter(r=>r.kind==="Repair").reduce((s,r)=>s+total(r),0);
  const pm=pmStatus(u);const m=curMeter(u);
  openSheet(`${h(u.unit)} · ${h(u.name||u.type||"")}`,`
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${statusPill(u.status)}${pm?`<span class="pill ${pm.level}">${h(pm.text)}</span>`:""}</div>
    ${S.canWrite?`<div class="f"><span class="lbl">Set status</span><div class="seg" id="dStat">${["Running","Down","Out of service"].map(s=>`<button type="button" data-s="${s}" aria-pressed="${(u.status||"Running")===s}">${s}</button>`).join("")}</div></div>`:""}
    <div class="split num" style="margin-top:0"><div class="i">Lifetime<b>${money0(life)}</b>${rs.length} jobs</div><div class="s">This year<b>${money0(ytd)}</b></div><div class="r">Repairs<b>${money0(rep)}</b>lifetime</div></div>
    <dl class="dl">${[["Type",u.type],["Make / model",[u.make,u.model].filter(Boolean).join(" ")],["Year",u.year],["Serial",u.serial],["Meter",m?m.toLocaleString()+" "+meterUnit(u):""],["PM interval",[u.pmMeter?u.pmMeter+" "+meterUnit(u):"",u.pmDays?u.pmDays+" days":""].filter(Boolean).join(" or ")],["Notes",u.notes]].filter(x=>x[1]).map(([k,v])=>`<dt>${k}</dt><dd>${h(v)}</dd>`).join("")}</dl>
    ${(()=>{const cs=checksFor(id).slice(0,6);if(!cs.length)return"";return`<div><span class="lbl">Daily checks</span></div><div class="rows">${cs.map(c=>`<div class="row" style="cursor:default">
      <div class="d num"><b>${fmtShort(c.date)}</b>${h(fmtTime(c.at))}</div>
      <div class="w"><div class="t">${h(c.driver||"Driver")}${c.shift?` · ${h(c.shift)} shift`:""}</div><div class="s">${c.hours?`<span class="num">${numv(c.hours).toLocaleString()} ${meterUnit(u)}</span>`:""}${c.defects?`<span>${h(String(c.defects).split("\n").length)} defect${String(c.defects).split("\n").length>1?"s":""}</span>`:""}</div></div>
      <div class="c"><span class="pill ${c.result==="Pass"?"ok":c.result==="Defects"?"warn":"bad"}">${h(c.result)}</span></div></div>`).join("")}</div>`})()}
    <div><span class="lbl">Work history</span></div>${rowsHtml(rs,false)}`,
    `${S.canWrite?`<button class="btn small" id="dEdit" type="button">Edit unit</button>`:""}<span class="sp"></span>${S.canWrite?`<button class="btn primary" id="dLog" type="button">+ Work order on ${h(u.unit)}</button>`:`<button class="btn" data-close type="button">Close</button>`}`,
    sc=>{
      bindRows(sc);
      const e=$("#dEdit");if(e)e.onclick=()=>unitForm(id);
      const l=$("#dLog");if(l)l.onclick=()=>workForm({unitId:id});
      sc.querySelectorAll("#dStat button").forEach(b=>b.onclick=async()=>{if(b.getAttribute("aria-pressed")==="true")return;
        sc.querySelectorAll("#dStat button").forEach(x=>x.setAttribute("aria-pressed",x===b));
        try{await S.db.collection("units").doc(id).update({status:b.dataset.s});toast(`${u.unit} marked ${b.dataset.s}`);setTimeout(()=>{if($("#scrim"))unitDetail(id)},50)}catch(err){toast(errMsg(err))}});
    });
}

/* ---------- Render / tabs ---------- */
function render(){
  renderKpis();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===S.tab));
  $("#logBtn").hidden=!S.canWrite;
  if(S.tab==="fleet")renderFleet();else if(S.tab==="orders")renderOrders();else if(S.tab==="history")renderHistory();else renderReports();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab;try{localStorage.setItem("fml-tab",S.tab)}catch(_){}render()});
$("#logBtn").onclick=()=>workForm();
try{const t=localStorage.getItem("fml-tab");if(t)S.tab=t}catch(_){}
try{S.me=localStorage.getItem("fml-me")||""}catch(_){}
function readHash(){const hs=(location.hash||"").slice(1);const m=/^wo-([A-Za-z0-9_-]{4,40})$/.exec(hs);
  if(m){S.pendingWO=m[1];S.tab="orders"}else if(["fleet","orders","history","reports"].includes(hs))S.tab=hs}
readHash();
function openPendingWO(){if(!S.pendingWO||S.status!=="ready")return;const id=S.pendingWO;S.pendingWO=null;
  try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}
  if(S.records.some(r=>r.id===id)){closeSheet();woDetail(id)}else toast("That work order wasn't found. It may have been deleted.")}
window.addEventListener("hashchange",()=>{readHash();render();openPendingWO()});
render();

/* ---------- Data: Google Sheets via Apps Script ---------- */
const SCRIPT_URL=(window.FLEET_SCRIPT_URL||"").trim();
const CODE_KEY="fml-code";
let code="";try{code=localStorage.getItem(CODE_KEY)||""}catch(_){}
async function call(action,payload){
  let res;
  try{res=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,code},payload||{}))})}
  catch(_){throw{code:"unavailable"}}
  let j;try{j=await res.json()}catch(_){throw{code:"unavailable"}}
  if(!j.ok){if(j.error==="unauthorized"){askCode(true);throw{code:"unauthorized"}}throw{code:"server",message:j.error}}
  return j;
}
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const api={collection(name){return{doc(id){id=id||genId();return{id,
  set:async d=>{await call("set",{collection:name,id,data:d});await load()},
  update:async d=>{await call("update",{collection:name,id,data:d});await load()},
  delete:async()=>{await call("delete",{collection:name,id});await load()}}}}}};
async function load(){
  if(!code)return;
  try{const j=await call("list");S.units=j.units||[];S.records=j.records||[];S.employees=j.employees||[];S.checks=j.checks||[];S.status="ready";$("#banner").innerHTML="";render();openPendingWO()}
  catch(e){if(e.code!=="unauthorized")$("#banner").innerHTML=`<div class="banner">Can't reach the fleet log right now. Check your signal; it will try again.</div>`}
}
function askCode(wrong){
  openSheet("Enter shop code",`<p class="note" style="margin:0">Ask your maintenance lead for the shop code. You only enter it once on this phone.</p>
    <div class="f"><label for="sc">Shop code</label><input type="text" id="sc" autocomplete="off" autocapitalize="off"></div><div class="err" role="alert">${wrong?"That code didn't work. Check it and try again.":""}</div>`,
    `<span class="sp"></span><button class="btn primary" id="scGo" type="button">Continue</button>`,
    ()=>{const i=$("#sc");setTimeout(()=>i.focus(),50);const go=()=>{const v=i.value.trim();if(!v)return;code=v;try{localStorage.setItem(CODE_KEY,v)}catch(_){}closeSheet();load()};
      $("#scGo").onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()}});
}
if(!SCRIPT_URL||/^PASTE/i.test(SCRIPT_URL)){
  S.canWrite=false;S.status="none";
  $("#banner").innerHTML=`<div class="banner">Setup needed: paste your Google Apps Script web app URL into index.html (see README).</div>`;render();
}else{
  S.db=api;
  S.dl={save:async({filename,data})=>{const type=/\.csv$/.test(filename)?"text/csv;charset=utf-8":"text/html;charset=utf-8";const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}};
  if(code)load();else askCode(false);
  const idle=()=>!document.hidden&&!$("#scrim")&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
  setInterval(()=>{if(idle())load()},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#scrim"))load()});
}
})();
</script>
